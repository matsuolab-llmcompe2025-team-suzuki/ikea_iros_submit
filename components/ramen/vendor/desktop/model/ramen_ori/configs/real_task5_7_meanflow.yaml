# @package _global_
# B-8 MeanFlow action expert 本走 config (Issue #122 Run 3、Phase 2 Alt-7)。
# real_task5_7 (本走 default) から FlowMatchingDiT → MeanFlow に action_expert のみ差替、
# 他 (data / vision / fusion / training) は default と完全同一で apples-to-apples 比較。
# 元 smoke: configs/meanflow_smoke.yaml (小 data + 少 step)。本 config は 100k step 本走。

defaults:
  - real_task5_7
  - _self_

training:
  # PR #127 review MEDIUM: variant ごとに ckpt_dir を明示 override して
  # 直接 launch 時 (pixi run train --config-name=real_task5_7_meanflow) に
  # default variant の ckpt を破壊するリスクを回避 (dispatcher 経由の CLI override
  # と同値、diamond で二重指定になっても値は同じなので害はない)。
  ckpt_dir: outputs/ramen_ori_phase2_meanflow

model:
  action_expert:
    _target_: model.ramen_ori.action_expert.MeanFlow
    chunk_len: ${model.chunk_len}
    action_dim: ${model.action_dim}
    embed_dim: 512     # DiT の 768 より小 (MeanFlow は single-step で軽量)
    depth: 6           # DiT の 12 の半分
    num_heads: 8
    mlp_ratio: 4.0
    context_dim: ${model.d_model}
  sample_n_steps: 1    # MeanFlow は straight flow の single-step default
