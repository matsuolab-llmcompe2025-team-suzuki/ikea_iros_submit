# Issue #146 RAMEN-Ori の data: 6 skill (β の rotate / move / insert + pick / flip / rotate_leg) を統合 overlay cache で学習する。
# 共通の設定 (sub_datasets より上) は unified_beta.yaml と同じ (test_data_configs.py で一致を確かめる)。
# 新しい 3 skill の cache は Issue #146 で作った (token は焼いていない、overlay / common / obb_yolo / v0 はある)。
#
# 画像は焼き込み済みの jpg だけを読む (baked_overlay、variant 10)。dataset が FRAME_CACHE_STRICT を立てるので、
# jpg が欠けていたら mp4 を decode せずに止まる。焼き込みの条件 (YOLO v11b の全件の検出、overlay の閾値 0.30 など) は
# data/bitrobot_lerobot_subtask_datasets/configs/unified_frame_cache.yaml で、学習はそこから読んで ckpt の約束に書く
# (top-level の contract.bake_config)。
#
# path は Sakura で統合 cache を作ったときの置き場所 (unified_frame_cache.yaml の work_root /nvme/unified_cache):
#   <skill>/src         LeRobot の meta・data (state / action / skill)。videos もあるが学習では読まない
#   <skill>/v2/overlay  焼き込み済みの jpg。手首の 2 カメラは v2/common への symlink
# Sakura を止めて /nvme が消えた後は、HF の各 dataset repo (meta・data、frame_cache_v2_tars の overlay / common) から
# 同じ path に戻す (Phase 9 の handoff)。
_target_: model.ramen_ori.data_lerobot.RamenOriMultiDataset

# ---- 全 sub 共通 (sub では上書きできない) ----
chunk_len: ${model.chunk_len}   # model と data の chunk を 1 か所で決める
img_size: 224
camera_keys:
  - observation.images.cam_0    # head_left (overlay を焼いたカメラ)
  - observation.images.cam_2    # left_wrist
  - observation.images.cam_3    # right_wrist
top_K: 4
num_classes: 7
num_cams: 4
obb_source: none                # overlay は画像に焼き込み済み
# overlay_* は online の overlay でだけ使う (baked では焼き込みの設定 file の値が約束に入る)
overlay_conf_threshold: 0.30
overlay_line_thickness: 2
overlay_class_filter: null
state_variant: 71d
load_prev_image: false          # 画像差分なし (model.temporal: null と組、RO-11)
include_depth_target: false
depth_target_size: [32, 32]
depth_target_num_cams: 3
use_relative_action: false
relative_stats_path: null
frame_cache_mode: baked_overlay
frame_cache_num_variants: 10    # v0 + v1..v9 (焼き込みの bake.num_variants と一致を起動時に確かめる)
auto_precompute_frame_cache: false
# memory の入力 (Issue #141 Phase 7)。true なら各 sub の head_left の OBB (obb_precomputed_root) と教師の指令から
# 起動時に表を作る (configs/retrain/c32_memory.yaml で true)
memory: false

# ---- sub ごと (書けるのは data の場所だけ)。skill_id は各 sub の episode meta の source_task_index から作る ----
sub_datasets:
  # rotate_table_base (source_task_index=5 → skill_id=4)
  - merged_source_root: /nvme/unified_cache/rotate_table_base/src
    repo_id: local/ramen_ori_rotate_table_base
    frame_cache_root_baked: /nvme/unified_cache/rotate_table_base/v2/overlay
    obb_precomputed_root: /nvme/unified_cache/rotate_table_base/obb_yolo   # memory 用 (統合 cache の OBB、上位 32 個)
    obb_precomputed_hash: ce877e8237be

  # move_table_base (source_task_index=7 → skill_id=5)
  - merged_source_root: /nvme/unified_cache/move_table_base/src
    repo_id: local/ramen_ori_move_table_base
    frame_cache_root_baked: /nvme/unified_cache/move_table_base/v2/overlay
    obb_precomputed_root: /nvme/unified_cache/move_table_base/obb_yolo   # memory 用 (統合 cache の OBB、上位 32 個)
    obb_precomputed_hash: ce877e8237be

  # insert_table_leg (source_task_index=0 → skill_id=0)
  - merged_source_root: /nvme/unified_cache/insert_table_leg/src
    repo_id: local/ramen_ori_insert_table_leg
    frame_cache_root_baked: /nvme/unified_cache/insert_table_leg/v2/overlay
    obb_precomputed_root: /nvme/unified_cache/insert_table_leg/obb_yolo   # memory 用 (統合 cache の OBB、上位 32 個)
    obb_precomputed_hash: ce877e8237be

  # pick_table_leg (source_task_index=4 → skill_id=3)
  - merged_source_root: /nvme/unified_cache/pick_table_leg/src
    repo_id: local/ramen_ori_pick_table_leg
    frame_cache_root_baked: /nvme/unified_cache/pick_table_leg/v2/overlay
    obb_precomputed_root: /nvme/unified_cache/pick_table_leg/obb_yolo   # memory 用 (統合 cache の OBB、上位 32 個)
    obb_precomputed_hash: ce877e8237be

  # flip_table (source_task_index=2 → skill_id=1)
  - merged_source_root: /nvme/unified_cache/flip_table/src
    repo_id: local/ramen_ori_flip_table
    frame_cache_root_baked: /nvme/unified_cache/flip_table/v2/overlay
    obb_precomputed_root: /nvme/unified_cache/flip_table/obb_yolo   # memory 用 (統合 cache の OBB、上位 32 個)
    obb_precomputed_hash: ce877e8237be

  # rotate_leg_to_tighten (source_task_index=3 → skill_id=2)
  - merged_source_root: /nvme/unified_cache/rotate_leg_to_tighten/src
    repo_id: local/ramen_ori_rotate_leg_to_tighten
    frame_cache_root_baked: /nvme/unified_cache/rotate_leg_to_tighten/v2/overlay
    obb_precomputed_root: /nvme/unified_cache/rotate_leg_to_tighten/obb_yolo   # memory 用 (統合 cache の OBB、上位 32 個)
    obb_precomputed_hash: ce877e8237be
