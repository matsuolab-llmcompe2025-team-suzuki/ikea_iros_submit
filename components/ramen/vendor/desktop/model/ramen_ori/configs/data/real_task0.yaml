# RAMEN-Ori R-6 bench task 0 (insert_table_leg) dataset (Issue #129 Phase I-0-4、2026-09-01)。
#
# β task = α (rotate/move) + **insert** の 1:1 balance に使う insert 単独 dataset。
# real_task5_7.yaml (rotate/move) と組み合わせて Run 4/5/6 で使う想定 (dataloader 側で
# WeightedRandomSampler / ConcatDataset で 1:1 mix)。
#
# 事前準備 (Sakura 上、handoff §Phase I-a 参照):
# 1. HF から task 0 の 34 chunks を pull:
#    Team-RAMEN/IROS2026_RAMEN_HARA_task_0_optimal_chunk{0..33}_of34_v1
# 2. prepare_multi_repo_source.py --tasks 0 で combined_task0/ に local merge
# 3. YOLO-OBB v11b precompute (obb_yolo/<hash>/) 生成 + HF push
# 4. precompute_augmented_frame_cache_ramen_ori.py で aug + overlay bake
#    (frame_cache_v2/token/ と overlay/ の 2 subroot) + HF push
_target_: model.ramen_ori.data_lerobot.RamenOriLerobotDataset
# 絶対 path (相対だと Hydra cwd = outputs/hydra/... で解決失敗、meta/info.json 見えない)。
# Sakura 上で combined_task0 が居る /nvme/merged_sources/... を直接指す。
merged_source_root: /nvme/merged_sources/combined_task0
# LeRobot 0.5.1 fork は repo_id が `local/...` prefix でも HF refs lookup を発火する。
# `merged_source_root=root=X` 指定で実データは root から load されるが、init 経路の refs check
# のために既に HF cache 済の real repo_id を渡す (task0 chunk0 で cache 存在確認済)。
# task5/task7 は Team-RAMEN 側の pull 済 repo が cache に居るので `local/...` でも通っていた
# (LeRobot が local prefix を認識するかは条件付きで、cache 有無に依存する)。
repo_id: "Team-RAMEN/IROS2026_RAMEN_HARA_task_0_optimal_chunk0_of34_v1"
chunk_len: 16
img_size: 224
# Issue #129 Phase A (2026-08-31、real_task5_7.yaml から継承): 3 cam。
# head_left + L/R wrist、head_right は baseline 63mm で depth 冗長、GR00T Run 1 と
# apples-to-apples 比較のため除外、compute -33%。
camera_keys:
  - observation.images.cam_0    # head_left
  - observation.images.cam_2    # left_wrist
  - observation.images.cam_3    # right_wrist
top_K: 4
num_classes: 7
num_cams: 4
obb_source: none    # 'none' (skip) | 'precomputed_token' (Run 2/6 coord grounding) | 'overlay' (Run 1/3/4/5)
# obb_source in {'precomputed_token', 'overlay'} 時に precompute cache dir を指定。
# task 0 用: /nvme/insert_dataset/obb_yolo (HF Team-RAMEN/HARA_task_0_optimal_merged_v1/obb_yolo/)
obb_precomputed_root: null
obb_precomputed_hash: null
# Overlay 描画 param (obb_source=overlay 時のみ有効、ただし baked_overlay mode では precompute 側で bake 済)
overlay_conf_threshold: 0.30
overlay_line_thickness: 2
overlay_class_filter: null
state_variant: 71d
include_depth_target: false
depth_target_size: [32, 32]
depth_target_num_cams: 3
# Issue #129 Phase F (2026-08-31): relative action space (Run 3/5 用)。
use_relative_action: false
relative_stats_path: null
# Issue #129 Phase I-0-3 (2026-09-01): offline aug bake cache mode。
# baked_token: /nvme/insert_dataset/frame_cache_v2/token
# baked_overlay: /nvme/insert_dataset/frame_cache_v2/overlay
# online: 従来通り (backward compat)
frame_cache_mode: online
frame_cache_root_baked: null
frame_cache_num_variants: 1
