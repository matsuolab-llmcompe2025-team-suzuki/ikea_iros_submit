# I-6 Depth aux head 有効化 smoke config (Issue #120 Alt-3)。
# real_task5_7_smoke に depth_target placeholder + aux_head を追加、backward 経路確認。
#
# 使用例:
#   pixi run train --config-name=aux_depth_smoke training.max_steps=6

defaults:
  - real_task5_7_smoke
  - _self_

data:
  include_depth_target: true   # placeholder zeros (SGBM 未実装のため)
  depth_target_size: [32, 32]
  depth_target_num_cams: 4

model:
  aux_head:
    _target_: model.ramen_ori.aux_depth.DepthHead
    vision_embed_dim: ${model.d_model}
    num_cams: 4
    pool_size: 8
    output_size: [32, 32]
    hidden_dim: 256
  aux_weight: 0.1
