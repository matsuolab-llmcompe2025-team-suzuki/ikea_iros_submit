# A-6 smoke train config (Issue #120 Phase A-6、Issue #122 で smoke 明示化)。
# real_task5_7.yaml の 2 chunks 版 (task 7 + task 5 chunk0 のみ)。
# 目的: RTX 3060 Ti 8GB で 100 step train が e2e 通ることを確認 (dry-run)。
# LR schedule / EMA / val / aug は本走用なので smoke では disabled、aug のみ弱で有効化して形だけ通す。
#
# 使用例:
#   pixi run train --config-name=real_task5_7_smoke training.max_steps=100

defaults:
  - real_task5_7
  - _self_

data:
  # smoke は task 5 chunk0 + task 7 の 2 repo だけで merged を作った場合の想定 path。
  # 実運用では GR00T の train_lerobot.sh が 9 chunks 全部 merge するので、
  # 実 smoke run 時は上位 config の merged_source_root を override するか、
  # 2 repo だけの smoke 用 merged を prepare_multi_repo で別途作る。
  merged_source_root: outputs/merged_sources/combined_task5_7_smoke

training:
  batch_size: 1        # RTX 3060 Ti 8GB + LingBot ViT-B/16 + 4 cam で余裕優先
  num_workers: 2       # pyav decode で CPU thread 争わないよう控えめ
  max_steps: 100
  log_every: 5
  ckpt_every: 200      # smoke では ckpt 出さない
  ckpt_dir: outputs/ramen_ori_phase2_smoke
  balancing:
    enabled: true      # task_7 と task_5 chunk0 の frame 比 (~1.5:1) を 1:1 に補正
    strategy: task_uniform

# Issue #122: smoke は本走機能を全 disabled、e2e path が通ることだけ確認 (walltime 節約)
lr_schedule:
  enabled: false
ema:
  enabled: false
val:
  enabled: false
augmentation:
  enabled: true        # aug path 自体は smoke で走らせる (光系実装バグを dry-run で拾う)
wandb:
  enabled: false
