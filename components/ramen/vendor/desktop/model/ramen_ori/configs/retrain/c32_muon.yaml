# @package _global_
# Issue #141 RAMEN-Ori 再学習: 土台 32 で optimizer だけを Muon に (6 本目、2026-09-14 ユーザー決定)
# 起動: pixi run train --config-name=retrain/c32_muon
#
# 中間の 2D の重み (fusion・action expert の attention / MLP / adaLN など約 199M) を Muon、入口・出口の層・Embedding・1D を AdamW。
# lr 1e-4・weight decay 0.01・schedule・clip 1.0 は c32 と同じ (Muon は更新の大きさを AdamW に合わせる)。
# q/k/v と adaLN はまとめた行列を分けて直交化する (base.yaml の optim.muon)
defaults:
  - /retrain/common
  - _self_

optim:
  name: muon

training:
  ckpt_dir: /nvme/train_outputs/ramen_ori_141_c32_muon
  hf_autopush:
    repo_id: Team-RAMEN/IROS2026_RAMEN_hara_ramen_ori_141_c32_muon

wandb:
  run_name: ramen_ori_141_c32_muon
