# @package _global_
# Issue #141 RAMEN-Ori 再学習: 32 + state の使い方 (学習時に state を group ごとに隠す、監査 doc §2「変種の候補 2」)
# 起動: pixi run train --config-name=retrain/c32_state_dropout
#
# 隠した値は正規化後の 0 (平均)、隠した印を group ごとに 1 個足す (推論では印は常に 0)。
# group ごとに独立なので、1 つ以上隠れる sample は 72%、全部見える sample は 28%、1 sample あたり平均 1.1 group
defaults:
  - /retrain/common
  - _self_

model:
  state:
    dropout:
      joint: 0.1          # 腰 3 + 腕 14。abs の目標は今の姿勢の近くにあるので、隠しすぎると chunk の頭で腕が飛ぶ
      hand: 0.1           # joint の末尾 2 + hand_state (同じ値)。掴んでいるかは画像でも分かるが、insert では大事
      tracking_err: 0.3   # 前の指令をなぞる近道 (copycat) の主な材料
      velocity: 0.3       # 直近の動きを続ける近道の材料
      ee_pose: 0.3        # 関節角から計算で出る量で、画像との照合を促したい

training:
  ckpt_dir: /nvme/train_outputs/ramen_ori_141_c32_state_dropout
  hf_autopush:
    repo_id: Team-RAMEN/IROS2026_RAMEN_hara_ramen_ori_141_c32_state_dropout

wandb:
  run_name: ramen_ori_141_c32_state_dropout
