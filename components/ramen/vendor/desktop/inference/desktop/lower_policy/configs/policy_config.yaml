# Learned policy variant registry (Issue #125 Phase 7)。
#
# variant 名 = 内部 conceptual identifier (backbone × mode)、HF repo 名は ckpt_ref
# に保持。実運用で "今日は GR00T baseline、明日は RAMEN-Ori C-2" みたいに config
# swap で切替える (CLI arg or entrypoint config で variant 指定)。
#
# 全 combination:
# - GR00T: 2 mode (none / overlay)。GR00T は explicit OBB token channel が無い
#   ので precomputed_token 非対応。
# - RAMEN-Ori: 3 mode (none / overlay / precomputed_token)。C-2 (token) は独自 channel、
#   C-11 (overlay) は backbone hint、default (none) は OBB signal 無し。
#
# ckpt_ref format:
#   HF repo: "Team-RAMEN/<repo>@<optional_sha>" (@revision は再現性 pin 用)
#   Local:   "/path/to/ckpt.pt" (dev/debug 用)
#   Null:    未 train / まだ ckpt 上がってない (from_ckpt() 呼ぶと error)

# Real-Time Chunking (RTC、Issue #137)。variant 単位で `rtc:` ブロックを足すと
# 有効化できる。未記載なら無効 = 従来経路そのまま。
#
#   rtc:
#     enabled: true         # RTC on/off
#     frozen_steps: auto    # auto = 実測 latency と tick 周期から毎回算出。
#                           # int 固定も可 (実測: GR00T 3 / RAMEN-Ori 1-2)
#     overlap_steps: null   # null = execution_steps を流用。実行時に
#                           # min(残り chunk 行数, overlap_steps) でクランプ
#     ramp_rate: 6.0        # 前 chunk から離れる指数 ramp の rate (本家既定)
#
# policy_type: groot_pick_legs は別 embodiment/schema のため enabled: true を reject。
# 重み式の詳細は inference/desktop/lower_policy/rtc.py の module docstring 参照。
#
# RAMEN-Ori の async 化 (Issue #137 Phase C-1b)。既定 (replan_family 未設定) は
# 毎 tick 同期推論で chunk 全体を返す従来動作で、実機実測 16.2Hz。学習データは
# 30fps なので実時間では teacher の約半分の速さで動いている。
#
#   replan_family: ramen_ori_flow_v1   # async 化 = 30Hz 狙い。RTC の前提でもある
#   execution_steps: 8                  # chunk_len 16 に対し重なり 8
#   temporal_lambda: -0.1               # null で TE off
#
# RTC は「推論中に既に送信済みの action」を凍結する手法なので、同期実行では
# frozen が定義上 0 になり soft ramp しか効かない。async と併せて使うこと。
#
# overlay 画像を通す jpg の色差 (Issue #139)。overlay mode の ckpt は box を描いた head 画像を
# jpg 保存した cache で学習しているので、推論でも同じ jpg に 1 回通す。色差は焼き込みの時期で違う。
#
#   overlay_jpeg_subsampling: "4:4:4"   # 既定。Issue #139 の統合 cache (2026-09-12 以降の焼き込み)
#   overlay_jpeg_subsampling: "4:2:0"   # それより前の焼き込み (GR00T #129 / RAMEN-Ori Phase K)
#
# 新しい cache で学習した ckpt は書かなくてよい。クォート必須 (YAML はクォート無しの
# 4:2:0 を整数として読む)。

# 本番 (Phase 3 の stage 実行) で使う variant。**どれで走るかの正本はここ** (Issue #148)。
#
# entrypoint は `--policy-variant-*` が渡されなかった slot だけをこの値で埋める。
# CLI は常に勝つので、評価で別の ckpt を試すときは今までどおり明示で上書きする。
# 埋めるのはその run の stage が要る slot だけで、stage 0 は 1 つも載らず、
# stage 1 は rotate_table_base を載せない (載せると「使わない policy」で弾かれる)。
#
# 値は policies: の key でなければならない (無い名前を書くと起動時に落ちる)。
default_variant_by_skill:
  # RAMEN-Ori #141 再学習 7 本からの選択 (2026-09-21)。#144 の実機評価で比較中。
  rotate_table_base: rotate_table_base_ramen_ori_141_c32_state_dropout
  # #148 の VLM -> GR00T -> IK MP -> rule-based handover が Phase 1 expert に使う版。
  pick_table_leg: groot_pick_legs_v1
  insert_table_leg: groot_insert_leg_200k
  rotate_leg_to_tighten: groot_rotate_leg_200k
  # step 20k pin (checkpoints/020000)。
  flip_table: groot_flip_table_n17_2_baseline

policies:
  # Issue #137: execution_steps は chunk_len (GR00T 16) より小さくすること。
  # 重なり = chunk_len - execution_steps が temporal ensemble の blend 区間で、
  # 16 だと重なり 0 = blend が一度も起きない (実機 insert がこれに該当)。
  # 8 = 重なり 8 step で blend 率 50%、本家 Isaac-GR00T deployment guide の
  # 例示 (--execution-horizon 8) とも一致。
  # ---- insert_table_leg (LeRobot GR00T、REAL_G1_RELATIVE_EEF、200k step) ---- #

  groot_insert_leg_200k:
    policy_type: groot
    mode: none
    # takada finetune (LeRobot fork wrapper)、200k step。150k もあり、coarse_insert
    # のみの Dex1_v2 は insert 全体ではなく前半 phase 特化 (別 variant として追加可)。
    ckpt_ref: Team-RAMEN/IROS2026_RAMEN_takada_insert_leg_optimal_gr00t_200k@0f0927bcc1aed6927fb26b82c017009961ee3d35
    device: cuda
    dtype: bf16
    replan_family: "groot_relative_eef_v1"  # Phase 4: 同 embodiment
    execution_steps: 8

  # ---- rotate_leg_to_tighten (LeRobot GR00T、curated optimal) ---- #

  groot_rotate_leg_160k:
    policy_type: groot
    mode: none
    ckpt_ref: Team-RAMEN/IROS2026_RAMEN_takada_rotate_leg_to_tighten_optimal_gr00t_160k@4c6bc5c29e3b4f8dfaaefd6285d0fe004780dbda
    device: cuda
    dtype: bf16
    replan_family: "groot_relative_eef_v1"
    execution_steps: 8

  groot_rotate_leg_200k:
    policy_type: groot
    mode: none
    # takada finetune (LeRobot fork wrapper)、200k step。160k もあり。
    # 全 533ep 分布の 50% を占める dominant skill (rotate_leg 系)。
    ckpt_ref: Team-RAMEN/IROS2026_RAMEN_takada_rotate_leg_to_tighten_optimal_gr00t_200k@51e306fd19dfbcba81932c6b6f073615fdb54b26
    device: cuda
    dtype: bf16
    replan_family: "groot_relative_eef_v1"  # Phase 4: 同 embodiment
    execution_steps: 8

  # ---- insert + tighten sequence (LeRobot GR00T、task 8) ---- #

  groot_insert_and_tighten_160k:
    policy_type: groot
    mode: none
    ckpt_ref: Team-RAMEN/IROS2026_RAMEN_takada_insert_and_tighten_optimal_gr00t_160k@23ea1d01677107511d6de2d28a0408e13aaf8fa9
    device: cuda
    dtype: bf16
    replan_family: "groot_relative_eef_v1"
    execution_steps: 8

  groot_insert_and_tighten_200k:
    policy_type: groot
    mode: none
    ckpt_ref: Team-RAMEN/IROS2026_RAMEN_takada_insert_and_tighten_optimal_gr00t_200k@3988504d73e6cca137c12c1c43b7354bed67128c
    device: cuda
    dtype: bf16
    replan_family: "groot_relative_eef_v1"
    execution_steps: 8

  # success + optimal curated dataset checkpoints.  Both artifacts were
  # trained with a native H16 action chunk.  The three slots below change only
  # how many decoded actions are executed before the async replacement chunk
  # is promoted; they do not alter the checkpoint's n_action_steps=16 contract.
  groot_insert_and_tighten_success_140k_steps4:
    policy_type: groot
    mode: none
    ckpt_ref: Team-RAMEN/IROS2026_RAMEN_takada_insert_and_tighten_optimal_success_gr00t_140k@d7ba8012df30f0128e66b191092f049aed1cb8cf
    device: cuda
    dtype: bf16
    replan_family: "groot_relative_eef_v1"
    execution_steps: 4

  groot_insert_and_tighten_success_140k_steps8:
    policy_type: groot
    mode: none
    ckpt_ref: Team-RAMEN/IROS2026_RAMEN_takada_insert_and_tighten_optimal_success_gr00t_140k@d7ba8012df30f0128e66b191092f049aed1cb8cf
    device: cuda
    dtype: bf16
    replan_family: "groot_relative_eef_v1"
    execution_steps: 8

  groot_insert_and_tighten_success_140k_steps16:
    policy_type: groot
    mode: none
    ckpt_ref: Team-RAMEN/IROS2026_RAMEN_takada_insert_and_tighten_optimal_success_gr00t_140k@d7ba8012df30f0128e66b191092f049aed1cb8cf
    device: cuda
    dtype: bf16
    replan_family: "groot_relative_eef_v1"
    execution_steps: 16

  groot_insert_and_tighten_success_200k_steps4:
    policy_type: groot
    mode: none
    ckpt_ref: Team-RAMEN/IROS2026_RAMEN_takada_insert_and_tighten_optimal_success_gr00t_200k@e8b349b1651876a14c554ce289b453f375f24df5
    device: cuda
    dtype: bf16
    replan_family: "groot_relative_eef_v1"
    execution_steps: 4

  groot_insert_and_tighten_success_200k_steps8:
    policy_type: groot
    mode: none
    ckpt_ref: Team-RAMEN/IROS2026_RAMEN_takada_insert_and_tighten_optimal_success_gr00t_200k@e8b349b1651876a14c554ce289b453f375f24df5
    device: cuda
    dtype: bf16
    replan_family: "groot_relative_eef_v1"
    execution_steps: 8

  groot_insert_and_tighten_success_200k_steps16:
    policy_type: groot
    mode: none
    ckpt_ref: Team-RAMEN/IROS2026_RAMEN_takada_insert_and_tighten_optimal_success_gr00t_200k@e8b349b1651876a14c554ce289b453f375f24df5
    device: cuda
    dtype: bf16
    replan_family: "groot_relative_eef_v1"
    execution_steps: 16

  # ---- flip_table (LeRobot GR00T、n17_4 最新) ---- #

  # Legacy near-success v2 baseline, selected immutable step 20k. The HF repo
  # contains multiple Trainer checkpoints, so load only this nested model.
  groot_flip_table_n17_2_baseline:
    policy_type: groot
    mode: none
    ckpt_ref: Team-RAMEN/IROS2026_RAMEN_suzuki_flip_table_groot_n17_2_baseline_checkpoints@1a408d87eda8d01f9b79113f1aed97a5d0811bff
    checkpoint_subdir: checkpoints/020000/pretrained_model
    device: cuda
    dtype: bf16
    replan_family: "groot_relative_eef_v1"
    temporal_lambda: -0.1
    execution_steps: 8

  groot_flip_table_n17_4:
    policy_type: groot
    mode: none
    # suzuki finetune (LeRobot fork wrapper)、n17_4 iteration 最新。
    # 他 candidate: _n17_2_baseline_checkpoints / _n17_insertion_candidate。
    # 組立最終工程 (table flip)、全 533ep 分布 5%。
    ckpt_ref: Team-RAMEN/IROS2026_RAMEN_suzuki_flip_table_groot_n17_4@737ce9179ee2bba8594687a8603f9b8ab1b33281
    device: cuda
    dtype: bf16
    replan_family: "groot_relative_eef_v1"  # Phase 4: 同 embodiment
    execution_steps: 8

  # Focused M3-M4 insertion expert.  It was warm-started from the legacy
  # near-success 20k flip-table policy, but its final 2k updates use only the
  # left-support -> right-insertion windows.  Keep the normal flip_table skill
  # identity/initial pose for controlled retention tests; deployment remains
  # arm+Dex1 only and executes four H40 steps before replanning.
  groot_flip_table_insertion_candidate:
    policy_type: groot
    mode: none
    ckpt_ref: Team-RAMEN/IROS2026_RAMEN_suzuki_flip_table_groot_n17_insertion_candidate@13b0295b1a4b618d504ed8245a00fa31e63f5ab5
    device: cuda
    dtype: bf16
    replan_family: "groot_relative_eef_v1"
    # The sealed candidate was evaluated/trained as a four-step specialist
    # without cross-chunk temporal blending.  The generic GR00T default (-0.1)
    # is intentionally not inherited here because blending relative-action
    # chunks would change the candidate's unvalidated execution contract.
    temporal_lambda: null
    execution_steps: 4

  # ---- pick_table_leg (Isaac-GR00T native raw、full-body embodiment、別 schema) ---- #

  groot_pick_legs_v1:
    policy_type: groot_pick_legs
    mode: none
    # Isaac-GR00T native raw finetune (Team-RAMEN 内別担当者 upload、命名 pattern
    # 違い、subdir load 必要)。実 ckpt は checkpoint-40000/ 下、config.json は
    # base_model=GR00T-N1.7-3B、embodiment=NEW_EMBODIMENT (raw robot_q 38D)。
    # checkpoint_subdir=null は root load (ver2-lora) を意味するので、subdir 配置の
    # ver1 は明示指定する (未指定=root の規約は generic groot 経路と共通)。
    ckpt_ref: Team-RAMEN/groot-n1.7-pick-legs-ver1@b63d9c49482cfc8998d1a3a0e3e0ac3ceb1d620a
    checkpoint_subdir: checkpoint-40000
    device: cuda
    dtype: bf16

  # pick_table_leg ver2-lora (LeRobot/root layout、明日の運営評価 deploy 用)。
  # ver1 と同じ new_embodiment 38D raw だが、Isaac Trainer subdir ではなく
  # LeRobot GR00T 形式で root 直下に merged safetensors + processor/statistics/
  # embodiment_id を配置。lora_adapter/ は再現 artifact (load 経路は使わない)。
  # → checkpoint_subdir 未指定 (null) = root load。action 処理は groot_pick_legs
  # のまま (38D new_embodiment、worker contract は ...ver2-lora を既定 pin 済)。
  groot_pick_legs_v2:
    policy_type: groot_pick_legs
    mode: none
    ckpt_ref: Team-RAMEN/groot-n1.7-pick-legs-ver2-lora@8f875028fffb1b35ebaf6a95d1575ccec86c12a1
    device: cuda
    dtype: bf16

  # ---- GR00T overlay (rotate_table_base default、Issue #132 Phase B で rotate 専用化) ---- #
  #
  # C-11 overlay 学習 run (Issue #122 GR00T overlay task)。head_left/right の 2 cam に
  # YOLO-OBB overlay を描画した状態で GR00T を fine-tune した variant。
  # 実 repo 名は "_v11b_100k_v1" (v11b = YOLO OBB Cycle 2 ckpt)、handoff doc
  # docs/handoff/issue_122_groot_overlay_task.md L283 と一致。
  #
  # **Issue #132 Phase B: rotate_table_base skill の default GR00T variant**
  # language_prompt = "rotate table base" 明示 (rotate specialist と同 prompt)。
  # ckpt_ref を Run 1/2/3 の HF path に書換えることで specialist 3 recipe 評価可
  # (3 recipe の HF repo は model/subtask_policy_training/configs/rotate_specialist/*.yaml)。
  # move_table_base では使わない (prompt 齟齬回避、docs 上分離運用)。
  groot_overlay:
    policy_type: groot
    mode: overlay
    overlay_jpeg_subsampling: "4:2:0"  # #129 の焼き込み cache で学習
    # Issue #137 Phase C-1 recipe 3: Run 3 (T0-1 + L1 + L4). Phase B' selected
    # async + TE with RTC disabled because RTC reached the right-elbow limit
    # earlier and increased safety-HOLD ticks.
    ckpt_ref: Team-RAMEN/IROS2026_RAMEN_hara_rotate_table_base_specialist_run3_all_v1@51ae562c6bb4f1928e59921a99a18839c77b0b90
    # Run 3 is a Trainer export whose deployable package is nested here.
    checkpoint_subdir: checkpoint-100000/pretrained_model
    device: cuda
    dtype: bf16
    replan_family: "groot_relative_eef_v1"  # Phase 4: 同 embodiment
    execution_steps: 8
    temporal_lambda: -0.1
    rtc:
      enabled: false
    language_prompt: "rotate table base"

  # ---- 実機で action パイプを通すための variant (会場 bring-up 用) ---- #
  #
  # Thor の HF cache に既に入っている ckpt を指す = ダウンロード無しで
  # `from_ckpt` → 推論 → 19-D action → MotionLimiter → actuator の経路を通せる。
  # repo が flat layout (config.json / model.safetensors が直下) なので
  # `checkpoint_subdir` は付けない。
  #
  # **性能評価には使わないこと。** `replan_family` 等が現行の主力 variant と
  # 揃っているとは限らず、あくまで「配管が動くか」を確かめるための slot。
  groot_overlay_cached:
    policy_type: groot
    mode: overlay
    overlay_jpeg_subsampling: "4:2:0"  # #129 の焼き込み cache で学習
    ckpt_ref: Team-RAMEN/IROS2026_RAMEN_hara_task_5_7_groot_overlay_v11b_100k_v1
    device: cuda
    dtype: bf16
    replan_family: "groot_relative_eef_v1"
    execution_steps: 8
    temporal_lambda: -0.1
    rtc:
      enabled: false
    language_prompt: "rotate table base"

  # ---- RAMEN-Ori task5+7 default (Phase 1.11 arm-only safety profile 用) ---- #
  #
  # Phase 2 5-run bench (default / g3 / meanflow / awr / radio) のうち、default 以外
  # の 4 architecture variant + null ckpt 予約 slot 2 個 (token / overlay) は
  # Issue #132 Phase D (2026-09-04) で削除。理由:
  # - Phase K R-6 bench (Phase C 追加 slot `rotate_table_base_ramen_ori`) で
  #   overlay + rel + β = val_ema ee_error 28.19mm (Phase 2 baseline ~48mm から
  #   40% 改善) が確定 = 実機評価の主力は Phase K Run 5 winner に集約
  # - Phase 2 5 variant は wandb val_ema loss で比較しただけ、実 inference は
  #   誰も回してない (memory `project_ramen_ori_5runs_completed`)
  # - null ckpt 予約 (token / overlay) の C-2/C-11 学習は未定 = 予約解除
  #
  # `ramen_ori_default` のみ保持: entrypoint.py の
  # `PHASE1_11_POLICY_VARIANT = "ramen_ori_default"` (arm-only safety profile の
  # 必須依存) + `smoke_policy_forward.py` の --variant 例で使用中のため。

  ramen_ori_default:
    policy_type: ramen_ori
    mode: none
    ckpt_ref: Team-RAMEN/IROS2026_RAMEN_hara_task_5_7_ramen_ori_default_100k_v1@fbef6ab022a95aa089edac8916dafcd6e76f1f69
    device: cuda
    dtype: fp32   # base.yaml:vision_backbone.dtype=fp32

  # ---- rotate_table_base RAMEN-Ori slot (Issue #132 Phase K R-6 bench 全 6 run 対応) ---- #
  #
  # Phase K は grounding (overlay / coord) × action (abs / rel) × dataset (α / β)
  # の 3 軸 bench (計 6 run、詳細 memory: project_ramen_ori_phase_k_bench_completed)。
  # Winning recipe = overlay + rel + β (Run 5) = val_ema ee_error avg 28.19mm、
  # baseline 5-run 平均 ~48mm から 40% 改善。
  #
  # 6 run を inference で切替評価するため、grounding × action の 3 組合せを 3 slot
  # として登録し、α / β dataset は ckpt_ref swap で切替える方式:
  #   - overlay_abs slot: Run 4 (β、default) ↔ Run 1 (α)
  #   - overlay_rel slot: Run 5 (β、winner、default) ↔ Run 3 (α)
  #   - coord_abs slot:   Run 6 (β、default) ↔ Run 2 (α)
  # rel × coord は Phase K bench に無し (未検証、次 phase 候補)。
  #
  # 3 slot 共通 config:
  # - dtype: fp32 (他 RAMEN-Ori 統一、autocast bf16 学習でも inference は fp32)
  # - cams: 3 cam layout (Phase K = head_left + wrist L/R、head_right 除外、GR00T と
  #   apples-to-apples 比較 + compute -33%)
  # - hydra_overrides: model.num_cams=4 (Phase K vocab、既存 default 5 variant は 6)
  # - action_dim 16 (waist 除外学習、inference は waist zeros pad で 19D 化)
  # - dispatch_waist は skill_config.yaml:rotate_table_base で false 統一
  #
  # 実機評価手順: docs/handoff/issue_137_rotate_table_base_model_eval.md。

  rotate_table_base_ramen_ori_overlay_abs:
    policy_type: ramen_ori
    mode: overlay
    overlay_jpeg_subsampling: "4:2:0"  # Phase K の焼き込み cache で学習
    # Issue #137 Phase C-2 recipe 3: Run 4 = overlay + absolute + beta.
    ckpt_ref: Team-RAMEN/IROS2026_RAMEN_ramen_ori_r6_run4_overlay_abs_beta_v1@d816dec11278db3fbd1c6dde4541434c04d5c922
    device: cuda
    dtype: fp32
    action_space: abs
    replan_family: ramen_ori_flow_v1
    execution_steps: 8
    temporal_lambda: -0.1
    rtc:
      enabled: false
    cams:
      - head_left
      - wrist_left
      - wrist_right
    hydra_overrides:
      - model.num_cams=4

  rotate_table_base_ramen_ori_overlay_rel:
    # Issue #137 Phase C-2 recipe 2: Run 3 = overlay + relative + alpha.
    policy_type: ramen_ori
    mode: overlay
    overlay_jpeg_subsampling: "4:2:0"  # Phase K の焼き込み cache で学習
    ckpt_ref: Team-RAMEN/IROS2026_RAMEN_ramen_ori_r6_run3_overlay_rel_alpha_v1@83c74764f549dd60835a48314b1ffa20215d9282
    device: cuda
    dtype: fp32
    action_space: rel
    replan_family: ramen_ori_flow_v1
    execution_steps: 8
    # Selected after B-3/B-4: keep 30 Hz async + temporal ensemble and disable
    # RTC for cumulative relative delta-q actions.
    temporal_lambda: -0.1
    rtc:
      # Issue #137 B-3 real trial: RTC on normalized delta-q accumulated prefix
      # error and produced out-of-range arm targets (827/899 safety HOLD ticks).
      # Keep the proven 30 Hz async + temporal-ensemble path, but do not apply
      # GR00T's pointwise-action RTC transform to cumulative relative actions.
      enabled: false
      frozen_steps: auto
      overlap_steps: null
      ramp_rate: 6.0
      allow_experimental_relative_action: false
    cams:
      - head_left
      - wrist_left
      - wrist_right
    hydra_overrides:
      - model.num_cams=4

  rotate_table_base_ramen_ori_coord_abs:
    # coord grounding = obb_source=precomputed_token 学習、mode: precomputed_token。
