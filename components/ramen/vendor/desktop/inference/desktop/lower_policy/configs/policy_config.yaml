yolo:
  # v11b Cycle 2 (2026-08-19 upload、Issue #122 D-3 決定値)。overlay / precomputed_token
  # mode 両方で共通に使う。SHA pin で再現性確保 (別 SHA を使いたい時は overridekab)。
  ckpt_ref: Team-RAMEN/IROS2026_RAMEN_Hara_yoloobb_upperpolicy@8221d0aef45d63666537c1f030810fb9b56dd1ed
  # 推論の入力解像度。学習 cache の焼き込み (unified_frame_cache.yaml: yolo.imgsz) と同じ値を
  # 明示する (Issue #141 INF-10)。重みに保存された値と同じだが、書いておかないと ultralytics の
  # 既定 (640) に落ちたときに気付けない。
  imgsz: 800
  # confidence の下限。焼き込みは 0.15 だが、policy に渡す検出は cleanup.yaml の policy.conf_min
  # (0.30、学習の overlay と同じ) で切るので、0.30 未満の枠は policy には届かない。ここを 0.15 に
  # 下げると上位 Planner (conf の下限を持たない) に入る材料だけが変わるので、現状の 0.25 を保つ。
  conf: 0.25

