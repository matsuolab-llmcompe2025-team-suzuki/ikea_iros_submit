        L.shoulder_yaw:   -0.30508682131767273
        L.elbow:           0.2318715900182724
        L.wrist_roll:     -0.15515673160552979
        L.wrist_pitch:     0.25118687748908997
        L.wrist_yaw:      -0.9844419956207275
        R.shoulder_pitch: -0.33353549242019653
        R.shoulder_roll:  -0.2762238085269928
        R.shoulder_yaw:   -0.025687849149107933
        R.elbow:           0.009081864729523659
        R.wrist_roll:      0.3412363827228546
        R.wrist_pitch:     0.4426576495170593
        R.wrist_yaw:       0.5473592877388
      dex1_opening_fraction:
        left:  0.6708845562405057
        right: 0.4206856886545817
      dataset_repo_id: "Team-RAMEN/IROS2026_RAMEN_takada_insert_and_tighten_curated_optimal"
      dataset_revision: "a5911ca298c9af795fd40a958e90bd76b489cc4c"
      training_episode_count: 289
      statistic: "median_action_robot_q_desired_frame0_arms14;median_action_hand_cmd_frame0_dex1_2"
      requires_separate_hand_initialization: true
      hand_initialization_instruction: "Place the table leg in the dataset-matched pre-insertion grasp, then close both Dex1 hands before the combined insert-and-tighten policy starts."

  # flip_table: issue-70 の FLIP_TABLE_V4_ABSOLUTE_FRAME0 転写 (n17_4 と共有)。
  #   dataset: Team-RAMEN/IROS2026_RAMEN_suzuki_flip_table_4 (268 ep = full_success + recovery_success の train split)。
