    # 出典: compute_skill_timeout.py, HARA task 4 786ep, p95=13.8s × 1.5, ceil。
    max_seconds_hard: 21
    # Phase 3 motion_limits (大きい reach motion 想定、accel を上げる)
    motion_limits:
      arm_acceleration_rad_s2: 12.0
    initial_pose:
      arm_position_rad:
        L.shoulder_pitch: -0.3292621821165085
        L.shoulder_roll:   0.4412737190723419
        L.shoulder_yaw:   -0.16212594509124756
        L.elbow:          -0.15982457995414734
        L.wrist_roll:     -0.16640856117010117
        L.wrist_pitch:     0.5013763606548309
        L.wrist_yaw:      -0.8052002191543579
        R.shoulder_pitch: -0.668845921754837
        R.shoulder_roll:  -0.27757230401039124
        R.shoulder_yaw:   -0.05611474625766277
        R.elbow:           0.41018396615982056
        R.wrist_roll:      0.08590780571103096
        R.wrist_pitch:     0.7006275355815887
        R.wrist_yaw:       0.2249610498547554
      dex1_opening_fraction:
        left:  0.4608106613  # 2.073647975921631 / 4.5
        right: 0.9934517013  # 4.470532655715942 / 4.5
      dataset_repo_id: "Team-RAMEN/IROS2026_RAMEN_suzuki_pick_leg_1"
