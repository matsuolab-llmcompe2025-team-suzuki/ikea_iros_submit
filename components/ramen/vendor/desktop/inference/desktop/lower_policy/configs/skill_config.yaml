      dataset_repo_id: "Team-RAMEN/IROS2026_RAMEN_takada_rotate_leg_to_tighten_curated_optimal"
      dataset_revision: "ec6e3a01bb587be5b491d8cbda636b717749078a"
      training_episode_count: 402
      statistic: "median_action_robot_q_desired_frame0_arms14;median_action_hand_cmd_frame0_dex1_2"
      requires_separate_hand_initialization: true
      hand_initialization_instruction: "Place the inserted table leg as recorded, then close both Dex1 hands to the dataset-matched rotate-to-tighten grasp before inference."

  # insert_and_tighten: curated task 8 (source task sequence 0 -> 3, gap=0)。
  # arm/hand initial pose is the exact frame-0 median over the 289 training
  # episodes listed by both 160k and 200k GR00T train_config.json files.
  # The sequence begins before insertion, so initialization follows the same
  # three-gate flow as insert_table_leg: open hands -> place leg -> dataset grip
  # -> policy.  A dedicated language prompt prevents accidental evaluation with
  # the rotate-only task-3 conditioning.
  insert_and_tighten:
    dispatch_waist: true
    # 出典: insert_table_leg (21s) + rotate_leg_to_tighten (58s) の sum。
    # 統合 skill = 2 skill 逐次実行なので個別 p95×1.5 の合算を保守側の上限として
    # 採用。専用 dataset (Team-RAMEN/..._insert_and_tighten_curated_optimal, 289ep)
    # から独立に p95 を出せば下振れする可能性あり、実機評価後に slide 検討。
    max_seconds_hard: 79
    motion_limits:
      arm_velocity_rad_s: 1.0
      arm_acceleration_rad_s2: 8.0
    initial_pose:
      arm_position_rad:
        L.shoulder_pitch: -0.5474485158920288
