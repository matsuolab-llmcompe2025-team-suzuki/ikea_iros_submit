        L.shoulder_yaw:   -0.3933115601539612
        L.elbow:           0.38866931200027466
        L.wrist_roll:      0.026323318481445312
        L.wrist_pitch:     0.09788772463798523
        L.wrist_yaw:      -1.2527214288711548
        R.shoulder_pitch: -0.3987988829612732
        R.shoulder_roll:  -0.4521753191947937
        R.shoulder_yaw:    0.17447586357593536
        R.elbow:           0.31719131767749786
        R.wrist_roll:      0.21218042820692062
        R.wrist_pitch:     0.1664465069770813
        R.wrist_yaw:       1.1244196891784668
      dex1_opening_fraction:
        left:  0.0
