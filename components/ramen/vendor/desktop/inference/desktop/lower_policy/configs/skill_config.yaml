  # rotate_leg_to_tighten: issue-70 の ROTATE_LEG_TO_TIGHTEN_OPTIMAL_FRAME0 転写。
  #   dataset: Team-RAMEN/IROS2026_RAMEN_takada_rotate_leg_to_tighten_curated_optimal (402 ep)。
  #   Model: groot_rotate_leg_200k (200k step)。
  #   requires_separate_hand_initialization=true (leg 挿入後、両 hand で dataset-matched grasp)。
  rotate_leg_to_tighten:
    dispatch_waist: true
    # 出典: compute_skill_timeout.py, HARA task 3 290ep, p95=38.5s × 1.5, ceil。
    max_seconds_hard: 58
    # Phase 3 motion_limits (通常 tighten motion、default 相当だが flip 準拠で明示)
