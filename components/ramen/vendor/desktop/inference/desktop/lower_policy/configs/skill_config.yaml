    motion_limits:
      arm_velocity_rad_s: 1.0
      arm_acceleration_rad_s2: 8.0
    initial_pose:
      arm_position_rad:
        L.shoulder_pitch: -0.4920995235443115
        L.shoulder_roll:   0.4307866245508194
        L.shoulder_yaw:   -0.2969074547290802
        L.elbow:           0.15555474162101746
        L.wrist_roll:     -0.16958489269018173
        L.wrist_pitch:     0.2890220284461975
        L.wrist_yaw:      -0.9073362946510315
        R.shoulder_pitch: -0.3478458970785141
        R.shoulder_roll:  -0.26190248131752014
        R.shoulder_yaw:   -0.013386612758040428
        R.elbow:           0.002267619827762246
        R.wrist_roll:      0.3340611010789871
