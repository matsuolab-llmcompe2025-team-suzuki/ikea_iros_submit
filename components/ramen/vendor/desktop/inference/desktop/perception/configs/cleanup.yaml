# Detection cleanup config (YOLO 偽検出後処理)。
# 詳細ロジックは inference/desktop/perception/cleaner.py docstring 参照。
#
# perception layer の後処理 config なので、skill_planner (thresholds.yaml) と別枠。

# ---- Step 1: class-wise max count enforcement + persistence check ----
max_count:
  workspace: 1
  table_top: 1
  hand_right: 1
  hand_left: 1
  leg: 4
  leg_tip: 4
  hole: 4

# case A (max 超え) の扱い (Issue #141 束 1-9): keep_continuing = 前 frame と IoU >= over_max_continue_iou の検出だけ残す
# (該当ゼロなら class 全消し)、fill_by_conf = 継続を先に残し、残りを conf 降順で max_count まで埋める。
# 2026-09-14 に fill_by_conf に変更 (実機 09-09 で leg_tip の消える枠 18.2% -> 8.9%、
# hand が見えなくなる frame 2.09% -> 1.61%。遷移判定に入る材料を増やす)
over_max_mode: fill_by_conf
# case A (max 超え): 前 frame cleaned dets と IoU 閾値
over_max_continue_iou: 0.9
# case B (max 内): 前 or 次 frame との類似判定 IoU 閾値
under_max_similar_iou: 0.5

# ---- Step 2: 3-frame temporal median filter ----
# 各 detection の verts を (self, prev_aligned, next_aligned) の element-wise
# median に置換。prev/next は same-class の best IoU match、pivot-alignment で
# 頂点順を self に揃えてから median を取る。
#
# 設計意図: YOLO の 1-frame vertex-order flip artifact を除去。
# 静止 / 持続的変化には影響を与えない (median = 中央値 = raw に近い)。
median_filter:
  enabled: true
  iou_match_min: 0.5       # prev/next 対応付け IoU 閾値
  # Issue #140 (振動対策、opt-in): IoU が全滅 (大振動でフレーム間移動大) の時だけ
  # 重心距離 nearest を fallback 採用する。0.0 = 無効 = 従来の IoU-only 挙動 (既定)。
  # 実機 A/B は env で上書き可: RAMEN_MEDIAN_MATCH_MAX_CENTROID_DIST / _AMBIGUITY_RATIO。
  match_max_centroid_dist: 0.0   # >0 で有効 (normalized 画面比、例 0.12 = 幅の12%まで追従)
  match_ambiguity_ratio: 2.0     # 同 class 複数時 nearest が2番目より2倍以上近い時のみ採用

# ---- policy に渡す検出 (Issue #141 束 1-9、推論の共通化の D3) ----
# 上の max_count 〜 median_filter は上位 Planner (遷移の判定) 用。次の frame を 2 回待つので、
# tick T の出力は frame T−2 の枠になる。policy (overlay・memory・progress monitor) は学習時に
# 「画像と同じ frame の生の検出」で描いた画像を見ているので、前の frame だけで判定する
# 遅れの無い filter (`policy_filter.py`) を別に掛ける。
# 値は measure_policy_detection_filter.py の計測 (教師 rotate / move / insert と実機 09-09 の 11 run) を見て
# 2026-09-14 に決めた: 上限だけを効かせ (conf の高い順で埋める)、1 frame だけの枠は消さず、ならしも入れない。
# このとき消える枠は教師 rotate 0.94% / 実機 2.30% で、class が丸ごと消えることは無い
# (手・天板・workspace の見えなくなる frame は 0.00%)。実機で脚先が上限 4 を超える frame が 24% あり、
# 5 個目は天板の角やロボットの手の上の誤検知 (conf 0.31〜0.44) だった。
# Issue #140 の重心 fallback (上の median_filter.match_max_centroid_dist) は上の Planner 用にだけ入れた。
# policy 側は smoothing: none / persist_frames: 0 で frame 間の対応づけを使っていないので今は効かない。
# smoothing や persist_frames を有効にするなら、大きく振れた frame で対応が切れる同じ弱点が出る。
policy:
  conf_min: 0.30              # 学習の overlay と同じ閾値 (YOLO は 0.25 以上を出す)
  max_count:
    workspace: 1
    table_top: 1
    hand_right: 1
    hand_left: 1
    leg: 4
    leg_tip: 4
    hole: 4
  over_cap: fill_by_conf      # 上限の扱い: fill_by_conf (続いている枠を先に、残りを conf の高い順で上限まで) | keep_continuing (今の Planner 用と同じ)
  over_max_continue_iou: 0.9  # keep_continuing のとき、直前に残した枠とこの IoU 以上の枠だけ残す
  continue_iou: 0.5           # 直前に残した枠とこの IoU 以上なら「続いている物」としてすぐ残す
  continue_frames: 1          # 「直前」を何 frame 分見るか (2 以上なら 1 frame の見逃しで消えない)
  persist_frames: 0           # 新しい物は、直前のこの frame 数の生の検出すべてに出ていれば残す (0 = すぐ残す)
  smoothing: none             # none | median3_past (直前 2 frame と合わせた中央値、動く物は約 1 frame 遅れる)
  smoothing_iou_min: 0.5
