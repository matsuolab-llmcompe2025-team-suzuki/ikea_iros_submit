# G1 lower policy skill 姿勢定義 (Issue #81)。
#
# 各 skill の default pose / stage 定義をここに集約する。
# 数値変更のたびに Python code を書き換えずに、YAML 更新 → 実機再検証 で回す。
#
# Joint 順 (G1_ARM_JOINT_INDICES = 15..28、14 次元):
#    L.shoulder_pitch  L.shoulder_roll  L.shoulder_yaw
#    L.elbow           L.wrist_roll     L.wrist_pitch    L.wrist_yaw
#    R.shoulder_pitch  R.shoulder_roll  R.shoulder_yaw
#    R.elbow           R.wrist_roll     R.wrist_pitch    R.wrist_yaw
#
# pose_rad は sparse 記法:
#   明示的に列挙した joint 以外は 0.0 rad として扱う。
#   これにより「使わない joint は書かない」で意図が読みやすくなる。
#
# YAML の読み込みは必ず yaml.safe_load() を使うこと (Python object 復元を封じる)。

# ---- Motion limits (Phase 3、Issue #128) ---- #
#
# VlaSkill.step の 30Hz per-tick target smoothing envelope。詳細は
# inference/desktop/lower_policy/motion_limits.py の docstring 参照。
#
# 単位:
#   arm_velocity_rad_s / arm_acceleration_rad_s2: waist+arm 各 joint (rad/s、rad/s²)。
#   hand_velocity_rad_s / hand_acceleration_rad_s2: Dex1 physical rad ([0, 5.4] range)。
#
# Resolution order (`load_motion_limits_for_skill`):
#   1. skills.<name>.motion_limits がある → それを使う
#   2. motion_limits_default → それを使う
#   3. どちらも無い → module DEFAULT_MOTION_LIMITS (hard-coded fallback)
#
# 初期値の根拠:
#   - flip_table 1.5 / 10.0 は issue-70 flip_table dataset で verified (SDK default
#     20-30 rad/s は速すぎ、1.0 は trajectory 歪む、1.5 が sweet spot と実測結論)
#   - 他 skill は未 verified、保守的 default を置いて実機観察後 tuning
motion_limits_default:
  arm_velocity_rad_s: 2.0
  arm_acceleration_rad_s2: 10.0
  hand_velocity_rad_s: 6.0
  hand_acceleration_rad_s2: 30.0

# 頭の手順で腕を開始姿勢へ動かすときの共通値 (Issue #141 束 1-8 / D2)。
#   衝突を避ける経路 (肩を後ろ → 横に開く → 前へ → 開始姿勢) を、速度・加速度を抑えて辿る。
#   値は Issue #128 Phase 3 で実機確認した CollisionAwareArmPreMotionSkill の既定値。
arm_pre_motion:
  velocity_limit_rad_s: 0.5
  acceleration_limit_rad_s2: 1.0
  measured_tolerance_rad: 0.10   # 実測がこの範囲に入ったら到達
  measured_velocity_tolerance_rad_s: 0.05  # 停止を実測してから次modelへ
  command_tolerance_rad: 0.001   # 最終targetまでLimiter指令が到達したことを確認
  stage_timeout_s: 15.0          # 1 つの経由姿勢に許す時間 (実時間ではなく制御時間)
  # 同じ経由姿勢に許す実時間 (Codex #12)。制御時間は tick が詰まると進まないので、
  # 実時間でもこれを超えたら失敗 (HOLD → 終了手順) にする。stage_timeout_s 以上。
  # model の読み込みで tick が止まる時間 (実測 8〜27 s) より十分長くとる。
  stage_wall_timeout_s: 90.0
  # model の境界 (pick → insert 等) で、次の skill の開始姿勢へ移る前に肩 pitch を
  # この分だけ上げる (Issue #152)。歩行後の頭上・側方の退避は skill 間には広すぎ、
  # 脚を保持した腕を大きく開くと持った脚がテーブルや反対の腕に当たる。
  # 0.15 rad で手先は約 +4〜6cm (G1 URDF FK、pick の開始姿勢で実測)。
  # 天板を擦るようなら上げる。0 にすると持ち上げず直線で移る。
  boundary_lift_rad: 0.15

# 頭の手順・境界の最後に、開始姿勢で保持する秒数 (Issue #159 T9)。腕を落ち着かせて
# から次の model を始める。自前経路の --setup-hold-sec は指定したときだけ上書きする。
# 大会経路の driver はここを読む。実機評価の runbook と同じ 3 秒。
hold_pose:
  hold_sec: 3.0

# 頭の手順の先頭で、ロボットが指令に従い始める (大会経路の go-live) まで待つ
# (Issue #159 T5、GoLiveWaitSkill)。両肩 pitch を lift_rad だけ上げる指令を出し続け、
# どちらかが detect_rad 以上ついてきたら完了。時間の制限は無い。
# 検出できないときは flag_paths のどれかに touch すれば強制できる (見たら消す):
#   Thor の端末で `touch ~/ramen_logs/go_live` (runbook の起動は -v ~/ramen_logs:/logs)
#   それ以外は container / lab PC の中で `touch /tmp/ramen_go_live`
go_live_wait:
  lift_rad: 0.05     # go-live の瞬間に動く量 (約 3°)
  detect_rad: 0.02   # ついてきたとみなす量 (go-live 前の揺れより大きく、lift より小さく)
  flag_paths: ["/logs/go_live", "/tmp/ramen_go_live"]

# 頭の手順で Dex1 を動かすときの共通値 (Issue #141 束 1-8 / D2)。
#   手を開く → 腕の pre-motion → 手を開始の開度へ → N 秒保持、の「手」の部分。
#   値は評価経路 (run_skill.py の _move_hands_to_target) の実績値をそのまま移したもの。
#   N 秒保持の秒数だけは起動引数 (--setup-hold-sec)。
hand_pre_motion:
  velocity_limit_rad_s: 1.5   # ramp の速さ
  tolerance_rad: 0.05         # 空中到達。約0.83mm相当、接触把持は別判定
  required_stable_samples: 5  # 到達がこの tick 数続いたら完了
  minimum_timeout_sec: 5.0    # 締め切り = max(これ, 所要時間 + timeout_margin_sec)
  timeout_margin_sec: 3.0
  state_max_age_s: 0.5        # これより古い Dex1 の state は使わない
  # 「既に物を握っている」とみなす、実測と直前の指令の差 (Issue #159 B4a-04)。
  # Dex1 は P 制御なので、握っている手は指令より開いた位置で止まる (脚保持中は
  # 指令 1.9 / 実測 2.2 前後)。grasp で閉じる向きのとき、この差がある側は
  # 「ストロークの 80% 進む」を求めずに、安定したら完了にする (pick -> insert の境界)。
  holding_contact_gap_rad: 0.10
  # model の境界で腕を上げる前に、握ったまま切られた手だけ離す (Issue #159 T3、
  # pick -> insert 以外)。握っている = 上の差があり、かつ実測がこれ以上。
  # 握り拳 (指令 0 で実測 0.2) は物を持てないので離さない。直前の指令が読めない
  # actuator では、実測がこれ以上の手を全部離す。
  holding_min_opening_rad: 1.0
  # 手を開く (頭の手順の hand_open) / 離す (境界の hand_release) ときの開度 (Issue #159 T8)。
  # 物理角。SDK では 5.4 rad、boundary では起動時に運営上限の 5.3 rad へ解決する。
  # 学習データの開度基準 4.5 rad は初期把持幅・policy 出力専用で、全開目標ではない。
  open_rad: 5.4

skills:
  # SetupSkill: entrypoint 起動直後に腕を安全 clearance 姿勢へ持っていく (Issue #81)。
  # orchestrator の initial skill として dispatch され、指定 dwell 経過後に
  # move_to_table へ auto-transition する。
  setup:
    stages:
      # Stage 1: 真横の高い clearance pose。腕を table 前方空間に出さず、
      #          肩 roll ±1.2 rad で腰・天板より上の安全な高さへ退避する。
      #          (2026-07-19 実機で lateral clearance として確認済)
      - name: lateral_clearance
        dwell_sec: 2.0
        pose_rad:
          L.shoulder_roll:  1.2
          R.shoulder_roll: -1.2

      # Stage 2: Stage 1 の肩 roll を維持したまま shoulder pitch を -0.20 rad だけ
      #          前へ傾けた forward clearance pose。真横退避 → 前方退避の順を
      #          厳密に分けることで下ろす動作 (衝突可能性) を挟まない。
      #          pitch 量は初回の実機安全確認用に保守的にしている。table clearance
      #          が十分であることを目視・joint state で確認するまで大きくしないこと。
      - name: forward_clearance
        dwell_sec: 2.0
        pose_rad:
          L.shoulder_pitch: -0.20
          L.shoulder_roll:   1.2
          R.shoulder_pitch: -0.20
          R.shoulder_roll:  -1.2

  # 腕を下ろした姿勢。stage 0 は歩く前に必ずここへ下ろし (Issue #152 / 2026-09-24)、
  # run の終わりもここへ戻してから手放す。
  # G1 は肘 0 で前腕が水平に前を向く (URDF、test_g1_arm_kinematics)。全部 0 は
  # 「腕を前に出した HOME」= 運営 WBC の既定 (肩 roll ±0.2、他 0) とほぼ同じで、
  # 下ろした姿勢ではない。肘 0.9 で手首は前 15 cm・torso から 7 cm 下 (肩の 32 cm 下、
  # G1 URDF FK)。真下 (肘 1.57) は歩行の範囲 (肘 1.00 + 余裕 0.05) の外なので、
  # 到達判定の許容 0.10 rad を足しても範囲に入る 0.9 に留める。
  # 肩 roll ±0.2 は運営 WBC の既定と同じ (WBC の可動範囲は |roll| >= 0.19)。
  walk_lowered_pose:
    pose_rad:
      L.shoulder_roll:  0.2
      L.elbow:          0.9
      R.shoulder_roll: -0.2
      R.elbow:          0.9
    # 下ろし終わった腕を歩行中に保持する前の確かめ方 (collision_aware_pre_motion.WALK_LATCH_CHECKS)。
    #   joint     = 関節ごとの歩行の範囲に入っていなければ歩かずに止める (既定)
    #   converged = 下ろす動きが収束していれば、範囲をわずかに外れても記録して保持する
    # 会場の pose lane は収束を手先で見るので、運営 IK の関節角しだいで joint が止まりうる。
    # 接続テストで決め、決まったらここを書き換える (それまでは起動の --walk-lowering-check で上書き)。
    latch_check: joint

  # MoveToTable: 組立台の前まで歩く Type A skill (Issue #64、Issue #81 Phase 2b で YAML 化)。
  #   - vx: 前進速度 [m/s]、default 0.185 は Issue #64 で実機確定した決め打ちルール。
  #   - max_dwell_sec: host / firmware 両方の fail-safe (host は orchestrator 側 auto-transition、
  #                    firmware は set_velocity の duration 引数として同値を渡す)。
  #                    到達時は orchestrator が TRANSITIONS graph の first candidate =
  #                    move_table_base へ auto-transition する。
  move_to_table:
    vx: 0.185
    max_dwell_sec: 1.0

  # SampleVLASkill: move_table_base 発火時に真横高い水平姿勢を返す Type B mock (Issue #75)。
  #   - default_pose_rad: SetupSkill Stage 1 と同じ肩 roll ±1.2 で腕高さを維持し、
  #                       move_to_table 到着 → move_table_base 遷移で腕が下がらないようにする。
  # (VLA 実装が入った段階でこの skill は差し替え予定、YAML section は残らない可能性あり)
  #
  # VLA 実装 (MoveTableBaseVlaSkill) 用の追加 field:
  #   - dispatch_waist: Model waist chunk[0:3] を actuator に流すか (default true)。
  #                     false = Model 出力を捨てる (arm_actuator は hold pose)。
  #                     腰暴走 → 脚 balance 崩れ懸念のある variant を安全に走らせる用。
  #                     SampleVLASkill (mock) は無視する field、real VlaSkill だけ読む。
  move_table_base:
    default_pose_rad:
      L.shoulder_roll:  1.2
      R.shoulder_roll: -1.2
    dispatch_waist: true
    # YOLO transition 検知漏れ時の last-resort hard timeout (policy 実行時間、
    # arm pre-motion / hand init overhead は含まない、orchestrator 側で加算)。
    # 出典: compute_skill_timeout.py, HARA task 7 384ep, p95=6.0s × 1.5, ceil。
    max_seconds_hard: 9
    # 時間切れの動き (Issue #141 束 1-13 / D4)。advance = 次の skill へ進む (既定)、
    # stop = そこで止める。秒数は上の max_seconds_hard。
    on_timeout: advance
    # Phase 3 motion_limits (partial override、未指定 field は motion_limits_default 継承):
    # 大きい motion (table base 回転 + 移動) を想定、accel を default より上げる。
    motion_limits:
      arm_acceleration_rad_s2: 12.0
    # 単体評価は clearance pose で待機せず、task_index=7 の dataset
    # frame-0 median まで移動してから policy 開始 Enter を待つ。
    initial_pose:
      arm_position_rad:
        L.shoulder_pitch: -0.3111256957
        L.shoulder_roll:   0.5789217949
        L.shoulder_yaw:   -0.3182108998
        L.elbow:          -0.0019328644
        L.wrist_roll:     -0.1308855787
        L.wrist_pitch:     0.2843062431
        L.wrist_yaw:      -1.0727896690
        R.shoulder_pitch: -0.1488823593
        R.shoulder_roll:  -0.5614076257
        R.shoulder_yaw:    0.1484381706
        R.elbow:          -0.2750582993
        R.wrist_roll:      0.2954401076
        R.wrist_pitch:     0.4890955836
        R.wrist_yaw:       0.8323650360
      dex1_opening_fraction:
        left:  0.7139263948
        right: 1.0000000000
      dataset_repo_id: "BitRobot/G1_WBT_Dex1_Building-Children-Table"
      dataset_revision: "4b5961c6f8b97ececa75ee73041b30bcbf463ae2"
      training_episode_count: 368
      statistic: "median_action_robot_q_desired_frame0_arms14;median_action_hand_cmd_frame0_dex1_2"
      requires_separate_hand_initialization: false

  # rotate_table_base: move_table_base から split した新設 VLA skill (task_index=5)。
  #   Model は同一 (RAMEN-Ori task 5+7 combined)、skill_id conditioning で区別。
  #   Issue #132 Phase C (2026-09-04): dispatch_waist true → false に変更。
  #   理由: Phase K 6 run (Run 5 winner 含む) は base.yaml action_dim: 19 → 16 で
  #   waist 3 dim を loss 圏外化して学習 (commit 652c31b、「inference 未使用のため」)、
  #   inference では waist output なし = pad zeros で 19D 化して drop する運用に統一。
  #   GR00T rotate specialist (19D 学習) 側の waist output も同時に drop (marginal
  #   effect、両者統一運用で slot 別 override を回避)。
  #   initial_pose は dataset frame-0 の実測 median (531 ep)。
  rotate_table_base:
    dispatch_waist: false
    # Issue #137 Phase 2: 天板の回転進捗 monitor (診断のみ、動作は変えない)。
    # 閾値の根拠は skills/rotate_progress.py の docstring 参照
    # (教師 1050 セグメントで誤検知 1.2% になる組み合わせ)。
    progress:
      success_deg: 8.0        # 教師 1 ストロークは median 16.4deg / p25 10.1deg
      median_window: 9
      sustain_frames: 6
      stale_timeout_s: 1.0
    # 教師 (compute_skill_timeout.py、HARA task 5 1401ep) の p95 は 7.7 s。
    # #137 の単体評価は 30 s 窓に合わせて 30 にしていたが、大会は stage ごとに
    # 3 分なので、回り切らない rotate に 30 s を使うと後続の pick / insert /
    # rotate_leg の機会が消える。p95 のすぐ上で切って次へ進める (ユーザー決定
    # 2026-09-22)。単体評価で長く見たいときは run_skill の --max-seconds で上書きする。
    max_seconds_hard: 10
    # 時間切れの動き (Issue #141 束 1-13 / D4)。advance = 次の skill へ進む (既定)、
    # stop = そこで止める。秒数は上の max_seconds_hard。
    on_timeout: advance
    # Issue #137 Phase 4: 空振り retry (既定 OFF)。この block を有効化すると
    # 「attempt_seconds 以内に天板が success_deg 回らなければ開始姿勢へ戻り、
    # z 天井を 1 段下げて打ち直す」動作になる。段の値は教師 1401 セグメントの
    # 最下点分布 (median 122.8mm / p5 112.1mm)。
    # 有効化の前に、まず素の条件で raw_target_19d / joint_effort を 1 本取ること。
    # retry:
    #   rungs_mm: [null, 122.8, 112.1]   # 1段目=素、2段目=median、3段目=p5(最終段)
    #   attempt_seconds: 3.0             # 教師の 8deg 到達は p50 1.8s / p90 3.0s
    #   return_timeout_s: 3.0
    #   return_mode: full_return         # or lift_and_reapproach
    #   return_tolerance_rad: 0.05
    # Phase 3 motion_limits (move_table_base と同じ envelope、大きい motion 想定)
    motion_limits:
      arm_acceleration_rad_s2: 12.0
    # Issue #132 Phase A: URDF FK の tool point offset を rotate_table_base 独自 fit
    # 値に override (fit は Team-RAMEN/IROS2026_RAMEN_HARA_rotate_table_base_merged_v1
    # の LeRobot GT `observation.state.ee_state` に対する pose-invariant mean)。
    # 未指定なら g1_urdf_fk.py:LEFT/RIGHT_WRIST_TOOL_OFFSET_M (3-dataset avg) にフォール
    # バック = 他 skill と同じ挙動。fit の検証は
    # inference/desktop/perception/tests/test_g1_urdf_fk.py の
    # TestFkCrossVerifyTrainingData (@pytest.mark.integration)。
    # 数値精度: fit std ~3-9cm (frame ごとの pose 依存誤差)、mm 精度は BitRobot
    # record tool 相当を Orin `/g1/ee_state` 経路で pub 追加後 (Issue #63 A-2 後)。
    wrist_tool_offset:
      left:  [0.091,  0.010,  0.085]
      right: [0.119, -0.078, -0.023]
    # 教師データで各腕関節が取った範囲 (Issue #141 束 1-4 / D5-1)。範囲を出た関節だけ
    # 端から margin_rad 内側を目標にして戻す (戻す速さは MotionLimiter 任せ)。
    teacher_joint_range:
      margin_rad: 0.02
      source:
        dataset_repo_id: "Team-RAMEN/IROS2026_RAMEN_HARA_rotate_table_base_merged_v1"
        dataset_revision: "9fb876364c8bf436446a36487dad3353802ee412"
        frame_count: 146873
        statistic: "min_max_action_robot_q_desired_arms14"
      arm_position_rad:
        L.shoulder_pitch: [-1.1753443480, +0.3259897828]
        L.shoulder_roll:  [-0.2004749924, +1.3681799173]
        L.shoulder_yaw:   [-0.7803453207, +0.6751561165]
        L.elbow:          [-0.8008953929, +1.3194274902]
        L.wrist_roll:     [-0.9567967057, +0.6108538508]
        L.wrist_pitch:    [-0.7115044594, +1.2166879177]
        L.wrist_yaw:      [-1.5679877996, +0.4148552418]
        R.shoulder_pitch: [-1.1408327818, +0.2704356313]
        R.shoulder_roll:  [-0.8594809771, +0.2385848612]
        R.shoulder_yaw:   [-0.4119032621, +0.7110962272]
        R.elbow:          [-0.5969154239, +1.3200325966]
        R.wrist_roll:     [-0.4038571715, +0.9061527848]
        R.wrist_pitch:    [-0.3855409622, +1.6144189835]
        R.wrist_yaw:      [-0.2097411752, +1.4965564013]
    initial_pose:
      arm_position_rad:
        L.shoulder_pitch: -0.4830605686
        L.shoulder_roll:   0.4441821277
        L.shoulder_yaw:   -0.0769655555
        L.elbow:           0.2223441899
        L.wrist_roll:      0.0807874203
        L.wrist_pitch:     0.4568341970
        L.wrist_yaw:      -0.5851719379
        R.shoulder_pitch: -0.3696676791
        R.shoulder_roll:  -0.1454999149
        R.shoulder_yaw:    0.0941407904
        R.elbow:           0.2638106048
        R.wrist_roll:      0.1134036779
        R.wrist_pitch:     0.3263158500
        R.wrist_yaw:       0.4706455171
      dex1_opening_fraction:
        left:  0.2046381632
        right: 0.8604006237
      dataset_repo_id: "BitRobot/G1_WBT_Dex1_Building-Children-Table"
      dataset_revision: "4b5961c6f8b97ececa75ee73041b30bcbf463ae2"
      training_episode_count: 531
      statistic: "median_action_robot_q_desired_frame0_arms14;median_action_hand_cmd_frame0_dex1_2"

  # insert_table_leg: issue-70 の INSERT_LEG_OPTIMAL_FRAME0 転写。
  #   dataset: Team-RAMEN/IROS2026_RAMEN_takada_insert_table_leg_curated_optimal (1510 ep)。
  #   Model: groot_insert_leg_200k (200k step)。
  #   requires_separate_hand_initialization=true (leg が hand に入った状態が start、
  #   operator が起動前に物理的に leg を配置する必要あり)。
