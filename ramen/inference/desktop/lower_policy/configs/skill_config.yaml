  # PickTableLegSkill: pick_table_leg を CV + Motion Planning + ルールベースで解く
  # 8-stage サブFSM (Issue #123)。全 stage が「目標ポーズ + Motion Planning」で動く
  # (固定軌道のリプレイはしない = 誤差が累積せず、本番調整は本 YAML の数値変更だけで済む)。
  #
  # ## 目標ポーズの出所
  #
  # `Team-RAMEN/IROS2026_RAMEN_suzuki_pick_leg_1` (2114 episode / 975,291 frame) の
  # `observation.state.robot_q_current` に **本 repo の G1ArmKinematics.fk を適用して**
  # 求めた中央値。座標系は root_link (骨盤) 基準 [x, y, z, roll, pitch, yaw]、
  # Euler XYZ、m / rad。
  #
  # dataset の `ee_action` をそのまま使っていないのは、teleop 記録側で関節角に対し
  # 時間ずれ (frame を -4 ずらすと姿勢残差が 4deg -> 1.9deg まで単調減少) があり、
  # IK と定義がずれるため。自前 FK で再導出すれば目標と IK が同じ定義になる。
  #
  # ただしこれは **Dataset B = lab 環境**の値。CLAUDE.md の通り本番シーンは訓練データと
  # 一致しないので、実機では検出したテーブル平面からの相対量として再導出すること
  # (焼き込み禁止)。
  #
  # ## stage 分割の理由
  #
  # - pre-grasp を独立させ、把持点の**真上**から鉛直に降ろす。clearance 姿勢から
  #   把持点へ直線で降りると斜めに突っ込んで隣の脚や天板を払う
  # - 「開く/閉じる」は腕を動かさない独立 stage。把持は「全閉指令 → 脚に機械的に
  #   止めさせる」で成否を判定するので、閉じ切る前に腕が動くと掴み損ねる
  # - release は必ず「開く → 引く」の順。逆だと脚を引きずる
  # - 両手が同じ脚を握る区間 (stage 5-7) は `moving` を片腕だけにする。両腕を同時に
  #   解くと剛体を介した閉ループ運動連鎖になり、内力が発生する (力センサが無く検知不可)
  pick_table_leg:
    dispatch_waist: true
    # 出典: compute_skill_timeout.py, HARA task 4 786ep, p95=13.8s × 1.5, ceil。
    max_seconds_hard: 21
    # 時間切れの動き (Issue #141 束 1-13 / D4)。advance = 次の skill へ進む (既定)、
    # stop = そこで止める。秒数は上の max_seconds_hard。
    on_timeout: advance
    motion_limits:
      arm_acceleration_rad_s2: 12.0
    # 教師データで各腕関節が取った範囲 (Issue #141 束 1-4 / D5-1)。範囲を出た関節だけ
    # 端から margin_rad 内側を目標にして戻す (戻す速さは MotionLimiter 任せ)。
    teacher_joint_range:
      margin_rad: 0.02
      source:
        dataset_repo_id: "Team-RAMEN/IROS2026_RAMEN_suzuki_pick_leg_1"
        dataset_revision: "4a5aef3bc43470b636f5c9d4f9102a30311b79a5"
        frame_count: 975291
        statistic: "min_max_action_robot_q_desired_arms14"
      arm_position_rad:
        L.shoulder_pitch: [-1.3964791298, +0.5338854194]
        L.shoulder_roll:  [-0.3389032781, +1.2228924036]
        L.shoulder_yaw:   [-0.9358727336, +0.9798387289]
        L.elbow:          [-1.0471985340, +1.3927408457]
        L.wrist_roll:     [-1.9461331367, +0.7674480677]
        L.wrist_pitch:    [-0.8562587500, +1.6144286394]
        L.wrist_yaw:      [-1.6144143343, +0.6001663208]
        R.shoulder_pitch: [-1.3605929613, +0.4217101336]
        R.shoulder_roll:  [-1.3587744236, +0.4272508323]
        R.shoulder_yaw:   [-0.9968507290, +0.7858214378]
        R.elbow:          [-0.7332293391, +1.3982717991]
        R.wrist_roll:     [-1.1178834438, +1.9722213745]
        R.wrist_pitch:    [-1.0955913067, +1.6144291162]
