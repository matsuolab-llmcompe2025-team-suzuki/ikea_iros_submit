        L.shoulder_yaw:   -0.16212594509124756
        L.elbow:          -0.15982457995414734
        L.wrist_roll:     -0.16640856117010117
        L.wrist_pitch:     0.5013763606548309
        L.wrist_yaw:      -0.8052002191543579
        R.shoulder_pitch: -0.668845921754837
        R.shoulder_roll:  -0.27757230401039124
        R.shoulder_yaw:   -0.05611474625766277
        R.elbow:           0.41018396615982056
        R.wrist_roll:      0.08590780571103096
        R.wrist_pitch:     0.7006275355815887
        R.wrist_yaw:       0.2249610498547554
      dex1_opening_fraction:
        left:  0.4608106613
        right: 0.9934517013
      dataset_repo_id: "Team-RAMEN/IROS2026_RAMEN_suzuki_pick_leg_1"
      dataset_revision: "4a5aef3bc43470b636f5c9d4f9102a30311b79a5"
      training_episode_count: 2114
      statistic: "median_action_robot_q_desired_frame0_arms14;median_action_hand_cmd_frame0_dex1_2"
      requires_separate_hand_initialization: false
    max_grasp_retries: 2

    # 把持判定しきい値。dataset 実測: 自由運動時の追従誤差は ±0.02、脚を噛むと
    # +0.350 に飽和。脚保持中の実測位置は 左 2.19 / 右 2.23 (IQR 0.058-0.097)。
    grasp_thresholds:
      open_min: 3.5
      hold_state_min: 2.05
      hold_state_max: 2.35
      fist_max: 0.5
      tracking_err_min: 0.2

    stages:
      # 1. 把持点の真上 10cm へ。右グリッパはここで開いておく。
      #    実測 把持ポーズ [0.3662, -0.1632, 0.1006, 0.1870, 0.8723, 0.3047]
      #    ばらつきは x IQR 0.045 / y IQR 0.077 / yaw IQR 0.298 で、実質
      #    (x, y, yaw) の 3 自由度しか動かない = OBB が出す量そのもの。
      # rpy_offset で手首を 0.5 rad 起こす。把持姿勢 (手首を寝かせた状態) のまま
      # 真上へ 10cm 上げると実観測把持配置の 26% が到達不能になる (URDF 限界でも
      # 18% 不能)。デモ者も持ち上げ時に手首を 50deg -> 18deg と起こしている。
      # 0.5 rad 起こすと到達率 100%。降下 stage が測地線補間で姿勢を戻す。
      - name: pregrasp
        moving: [right]
        goal: {kind: cv, offset: [0.0, 0.0, 0.10], rpy_offset: [0.0, -0.5, 0.0]}
        grip: {right: 4.5}
        duration_sec: 2.0
        timeout_sec: 8.0
        exit: {pos_tol_m: 0.025, rot_tol_rad: 0.15}

      # 2. 鉛直に降下して把持ポーズへ。stage 1 と同じ CV 目標なので直線 = 鉛直。
      - name: approach_grasp
        moving: [right]
        goal: {kind: cv}
        duration_sec: 1.2
        timeout_sec: 5.0
        exit: {pos_tol_m: 0.02, rot_tol_rad: 0.12}

      # 3. 右グリッパ全閉。脚が止めれば HOLDING、閉じ切れば空振り。腕は動かさない。
      - name: close_grasp
        moving: []
        goal: null
        grip: {right: 0.0}
        duration_sec: 0.5
        timeout_sec: 3.0
        exit: {grasp: right}
        retry_from: pregrasp

      # 4. 提示姿勢へ。ここで初めて状態が揃う (以降の stage の起点)。
      - name: to_presentation
        moving: [right]
        goal: {kind: fixed, pose: [0.3170, -0.0828, 0.1615, 0.2201, 0.0212, 0.9416]}
        duration_sec: 2.5
        timeout_sec: 8.0
        exit: {pos_tol_m: 0.02, rot_tol_rad: 0.12}

      # 5. 左腕を持ち替え位置へ + 左グリッパを開く。右腕は freeze。
      #    offset は **右グリッパ座標系**での実測中央値。基準は右手の公称値ではなく
      #    実測 FK なので、stage 4 が多少ずれて終わっても左手の目標が追従する。
      - name: approach_handover
        moving: [left]
        goal:
          kind: relative
          reference: right
          offset: [0.1588, 0.0937, 0.0293]
          rpy: [-0.6395, -0.0812, -0.6523]
        grip: {left: 4.5}
        duration_sec: 2.5
        timeout_sec: 8.0
        exit: {pos_tol_m: 0.025, rot_tol_rad: 0.15}

      # 6. 左グリッパ全閉。両腕とも動かさない。
      #    空振り時は stage 1 ではなく approach_handover へ戻る (stage 1 に戻ると
      #    右手が脚を保持したまま再検出することになり破綻する)。
      - name: close_handover
        moving: []
        goal: null
        grip: {left: 0.0}
        duration_sec: 0.5
        timeout_sec: 3.0
        exit: {grasp: left}
        retry_from: approach_handover

      # 7. 右グリッパを開く。まだ引かない (引きながら開くと脚を引きずる)。
      - name: release
        moving: []
        goal: null
        grip: {right: 4.5}
        duration_sec: 0.5
        timeout_sec: 3.0
        exit: {release: right}

      # 8. 右腕を退避。実測 末尾10% の右EE 中央値。
      - name: retract
        moving: [right]
        goal: {kind: fixed, pose: [0.3121, -0.1209, 0.1342, 0.2064, 0.1638, 0.8023]}
        duration_sec: 1.5
        timeout_sec: 6.0
        exit: {pos_tol_m: 0.03, rot_tol_rad: 0.20}

    # OBB -> root_link 把持ポーズの変換 (ObbGraspPoseProvider)。
    #
    # !! extrinsic は URDF の d435_joint をそのまま置いた **仮の値** で、実機の
    #    head カメラ (D435 系ではない別 stereo モジュール、docs/dataset/depth.md) の
    #    校正値ではない。視線中心が平面に当たる点は [0.394, +0.018] で、dataset の
    #    把持点中央値 [0.366, -0.163] と約 0.18 m ずれる。実機投入前に必ず上書きすること。
    #
    # camera intrinsics の default は depth.md の rectified P1 実測値 (fx=fy=510.15)。
    # approach_roll / approach_pitch / support_plane.offset は上記 FK 再導出の実測中央値。
    obb_grasp:
      camera: {fx: 510.15, fy: 510.15, cx: 320.0, cy: 240.0, width: 640, height: 480}
      extrinsic: {xyz: [0.0576235, 0.01753, 0.42987], rpy: [0.0, 0.83077672, 0.0]}
      # Ray projection uses the physical work-surface height.  The commanded
      # pose is Dex1's base frame, about 0.101 m above that surface at grasp.
      # These must stay separate: putting 0.101 into support_plane changes the
      # image-to-metric scale and makes a real ~0.4 m leg appear ~0.18 m long.
      support_plane: {normal: [0.0, 0.0, 1.0], offset: 0.0}
      grasp_height_offset_m: 0.101
      leg_class: leg
      approach_roll: 0.187
      approach_pitch: 0.872
      # 脚の長軸上のどこを掴むか。比率は固定せず、**持ち替え距離から逆算**する:
      #   (1 - 比率) x 脚長 >= handover_clearance_m + handover_margin_m
      # handover_clearance_m は stages[approach_handover] の offset の大きさ
      # (|[0.1588, 0.0937, 0.0293]| = 0.187 m) と一致させること。ここがずれると
      # 左手が脚の先の空を掴む。test がこの一致を検証している。
      # 脚が短くて条件を満たせない検出は provider が捨てる。
      handover_clearance_m: 0.187
      handover_margin_m: 0.03
      # 右手も脚端ぎりぎりを掴まないため、把持点より手前側に最低4cm残す。
      # 遠端側 0.217m と合わせ、投影脚長が 0.257m 未満なら候補を棄却する。
      grasp_near_end_margin_m: 0.04
      # handover_clearance_m 未設定時のみ使われる予備の固定比率。
      grasp_fraction: 0.5
      min_confidence: 0.5
      # 到達可能な手首姿勢の候補。先頭が第一候補 (dataset 実測中央値)。
      # roll/pitch を固定にすると把持点中央値がそのまま到達域の縁に来てしまい
      # (前方 +x / 左右いずれも余裕 0.00 m)、脚が少しでも動くと IK が解けない。
      # 候補から選べるようにすると -y 0.085 / +y 0.095 / -x 0.205 m まで広がる。
      # ただし **前方 +x の余裕は 0.010 m しかない** — 固定ベースの構造的な限界で、
      # move_to_table の停止位置が数 cm 後ろにずれると脚に届かなくなる。実機では
      # 停止位置の再現性を優先して確認すること。
      roll_candidates:  [0.187, 0.0, -0.25, 0.45]
      pitch_candidates: [0.872, 0.75, 0.65, 0.55]
      # 姿勢候補の可否判定を pre-grasp 込みで行うための情報。
      # stages[0] の goal と同じ値にしておくこと。
      pregrasp_offset: [0.0, 0.0, 0.10]
      pregrasp_rpy_offset: [0.0, -0.5, 0.0]
      # 探索マスク。dataset 実測では把持点の 95% が中央値から 0.122 m 以内だが、
      # 到達域のほうが狭いので実効的な上限はそちら (届かない脚は provider が
      # 候補から外し、skill は「未検出」として待機する)。
      search_center: [0.366, -0.163]
      search_radius: 0.15

    # Dex1-1 グリッパの DDS 指令経路 (Dex1DdsGripper)。
    # topic は Orin 側 dex1_1_gripper_server の既定 (rt/dex1/{side}/cmd, /state)。
    # 把持は「全閉指令 → 脚に機械的に止めさせる」方式なので、握り込みすぎない
    # 弱めの kp にしてある。実機で要調整。
    # limits は設定ミスで機械限界を超える指令が飛ばないための安全枠。
    dex1:
      limits: {min_position: 0.0, max_position: 4.5}
      gains: {kp: 5.0, kd: 0.1}
