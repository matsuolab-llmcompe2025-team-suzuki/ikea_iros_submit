# Copy this file outside Git after measuring the physical head-camera mount.
# The runtime refuses actuation unless this is exactly true.
calibration_verified: false
calibration_id: "REPLACE_WITH_ROBOT_AND_DATE"

# Rectified head-left pinhole intrinsics.
camera:
  fx: 0.0
  fy: 0.0
  cx: 0.0
  cy: 0.0
  width: 640
  height: 480

# torso_link -> head-left camera transform. Set optical=true when xyz/rpy
# describe the camera body frame and the ROS optical-frame rotation is needed.
extrinsic:
  xyz: [0.0, 0.0, 0.0]
  rpy: [0.0, 0.0, 0.0]
  optical: true

# Plane on which the loose table leg rests, expressed in root_link.
support_plane:
  normal: [0.0, 0.0, 1.0]
  offset: 0.0
