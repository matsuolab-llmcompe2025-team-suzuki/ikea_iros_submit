# H-7 AWR twist 有効化 smoke config (Issue #120 Alt-6)。
# balancing (A-5) + AWR (Alt-6) 併用の smoke。
#
# 使用例:
#   pixi run train --config-name=awr_smoke training.max_steps=6

defaults:
  - real_task5_7_smoke
  - _self_

training:
  balancing:
    enabled: true       # AWR は balancing weight に乗算 mode でも動く
    strategy: task_uniform
  awr:
    enabled: true
    method: inverse
    temperature: 1.0
