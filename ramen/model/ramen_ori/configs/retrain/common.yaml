# @package _global_
# Issue #141 RAMEN-Ori 再学習の共通設定。run ごとの file (c32.yaml など) がこれを defaults に持つ。
#
# 起動 (Sakura、repo の model/ramen_ori で): pixi run train --config-name=retrain/c32
#
# base.yaml の既定は Phase K の構造のまま (推論が base.yaml から model を組み立てるため、Issue #141 Phase 8 まで)。
# 再学習で変える設定はここで on にする。Phase K (Run 4、overlay + abs + β) からの違い:
#   - chunk 16 → 32 (RO-17)、画像差分なし (RO-11)、state / action を model の中で正規化 (RO-4 / RO-6)
#   - FK の loss を 3 項・自動の重みに (RO-16、base の fk_loss: 0.2 / 上限 1.2)
#   - backbone は凍結のまま常に eval (RO-13)、compile は部分ごと (Issue #141 Phase 4)
#   - attention の q/k を RMSNorm (QK-norm)、勾配の全体の norm を 1.0 で clip (Issue #141、c32 の発散の直し)
#   - data は #139 の統合 overlay cache (configs/data/unified_beta.yaml)
# batch / step / lr / EMA / balancing / val / bf16 の autocast は Phase K と同じ (FK だけ fp32 で計算する、fk.py)。
defaults:
  - /base
  - override /data: unified_beta
  - _self_

model:
  chunk_len: 32
  temporal: null            # 画像差分なし (data.load_prev_image: false と組)
  vision:
    freeze: true            # backbone を凍結 (一部解放は c32_partial_vision.yaml)
  state:
    input_norm: false       # 入口の LayerNorm を外し、normalization で次元ごとに正規化する
  l4_enabled: true          # FK の loss (左側・右側・両側の 3 項)
  normalization:
    enabled: true
  # attention の q/k を head ごとに RMSNorm (attention.py)。c32 の 1・2 回目は fusion の 0 層目の logit が
  # 5k 約 900 → 30k 約 15 万と増え続け、attention が state の token に張り付いて勾配が state.fc1 に集まった
  fusion:
    qk_norm: true
  action_expert:
    qk_norm: true

precision:
  autocast_dtype: bfloat16  # ローカル (RTX 3060 Ti、batch 4) で fp32 179 ms → 141 ms / step

optim:
  grad_clip_norm: 1.0     # c32 の 1 回目は clip なしで 30k step から崩れた (勾配が state.fc1 に集中)

speedup:
  torch_compile: true
  torch_compile_mode: default

# augmentation は base の既定 (off) のまま: 画像の aug は焼き込み済み (unified_frame_cache.yaml の augmentation)。
# baked の画像は dataset の aug を通らない (Normalize だけ)

training:
  batch_size: 32
  num_workers: 20
  prefetch_factor: 4
  max_steps: 100000
  log_every: 100
  ckpt_every: 5000
  seed: 42
  # β は insert の frame が 87% を占めるので、skill ごとに同じ確率で引く
  balancing:
    enabled: true
    strategy: task_uniform
  hf_autopush:
    enabled: true           # repo_id は run ごとの file に書く
    every_n_ckpt: 2         # 10k step ごと
    private: true

lr_schedule:
  enabled: true

ema:
  enabled: true

val:
  enabled: true

wandb:
  enabled: true

contract:
  bake_config: data/bitrobot_lerobot_subtask_datasets/configs/unified_frame_cache.yaml
