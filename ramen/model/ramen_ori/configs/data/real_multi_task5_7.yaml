# RAMEN-Ori Phase K α task: task5 (rotate_table_base) + task7 (move_table_base) の
# 2-sub-dataset multi wrapper (Issue #129 Phase K、2026-09-01)。
#
# Merge を skip して各 task の baked frame_cache_v2 を pointing だけで学習する構成。
# 詳細は data_lerobot.RamenOriMultiDataset docstring 参照。
#
# 1:1 mix の実現:
# - training.balancing.enabled=true + strategy=task_uniform
# - 各 sub が単一 skill_id (rotate=4, move=5) を持つので task_uniform が 1:1 mix と同義
#
# CLI override 例:
#   pixi run train --config-name=real_multi_task5_7 \
#     data.frame_cache_mode=baked_overlay \
#     data.sub_datasets.0.frame_cache_root_baked=/nvme/rotate_table_base/frame_cache_v2/overlay \
#     data.sub_datasets.1.frame_cache_root_baked=/nvme/task7/frame_cache_v2/overlay \
#     data.frame_cache_num_variants=10
#
_target_: model.ramen_ori.data_lerobot.RamenOriMultiDataset

# ---- shared kwargs (全 sub broadcast) ----
chunk_len: 16
img_size: 224
# Issue #129 Phase A: 3 cam (head_left + L/R wrist、head_right 除外)
camera_keys:
  - observation.images.cam_0    # head_left
  - observation.images.cam_2    # left_wrist
  - observation.images.cam_3    # right_wrist
top_K: 4
num_classes: 7
num_cams: 4
obb_source: none    # Run 1/3/4/5 (overlay bake 済で obb 経路無効); Run 2/6 は precomputed_token を CLI override
overlay_conf_threshold: 0.30
overlay_line_thickness: 2
overlay_class_filter: null
state_variant: 71d
include_depth_target: false
depth_target_size: [32, 32]
depth_target_num_cams: 3
use_relative_action: false   # Run 3/5 は data.use_relative_action=true を CLI override
# Issue #129 Phase K (2026-09-01): rel action 用 unified stats (task5+7 pooled)。
# multi-dataset で batch は sub 間 mix、model 側 denormalize (train.py が
# cfg.data.relative_stats_path を参照) は 1 個の stats しか使えないため、
# dataset 側 normalize も同じ stats に統一。frame 数 weight で pool した stats:
#   /nvme/relative_stats_task5_7_unified.pt (N=193415)
# 計算方法: scripts/compute_relative_action_stats.py で per-task 実行 → tools 側の
# unified merger (/tmp/compute_unified_stats.py) で N-weighted pool。
# Run 3/5 で use_relative_action=true にした時のみ意味を持つ (default false では ignore)。
relative_stats_path: /nvme/relative_stats_task5_7_unified.pt
frame_cache_mode: online     # Run 起動時 baked_overlay / baked_token を CLI override
frame_cache_num_variants: 1  # baked 時は >=2 を CLI override (sub では上書きできない)
auto_precompute_frame_cache: true

# ---- per-sub config ----
# skill_id は各 sub の episode meta の source_task_index を skill_mapping.py の表で変換する
# (Issue #141 RO-1、config には対応表を持たない)。1 sub = 1 skill なので task_uniform balancing は sub 間 1:1。
sub_datasets:
  # sub0: rotate_table_base (source_task_index=5 → skill_id=4)
  - merged_source_root: /nvme/rotate_table_base
    repo_id: local/ramen_ori_task5_rotate
    # Run 起動時 CLI override 予定:
    #   frame_cache_root_baked: /nvme/rotate_table_base/frame_cache_v2/overlay (or /token)
    #   obb_precomputed_root: /nvme/rotate_table_base/obb_yolo   (Run 2/6 のみ)
    frame_cache_root_baked: null
    obb_precomputed_root: null
    obb_precomputed_hash: null

  # sub1: move_table_base (source_task_index=7 → skill_id=5)
  - merged_source_root: /nvme/task7
    repo_id: local/ramen_ori_task7_move
    frame_cache_root_baked: null
    obb_precomputed_root: null
    obb_precomputed_hash: null
