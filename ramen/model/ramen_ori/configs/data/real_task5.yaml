# Task 5 (rotate_table_base) 単独 dataset (Issue #129 Phase K、2026-09-01)。
# compute_relative_action_stats.py で per-task Δq stats を計算するための config。
# 学習には使わない (学習は real_multi_task5_7 経由の multi wrapper)。
#
# 使用例:
#   pixi run --frozen python -m model.ramen_ori.scripts.compute_relative_action_stats \
#     --data-config real_task5 \
#     --output /nvme/relative_stats_task5.pt \
#     --subsample-ratio 0.2
#
_target_: model.ramen_ori.data_lerobot.RamenOriLerobotDataset
merged_source_root: /nvme/rotate_table_base
repo_id: "local/ramen_ori_task5_rotate"
chunk_len: 16
img_size: 224
camera_keys:
  - observation.images.cam_0
  - observation.images.cam_2
  - observation.images.cam_3
top_K: 4
num_classes: 7
num_cams: 4
obb_source: none
obb_precomputed_root: null
obb_precomputed_hash: null
overlay_conf_threshold: 0.30
overlay_line_thickness: 2
overlay_class_filter: null
state_variant: 71d
include_depth_target: false
depth_target_size: [32, 32]
depth_target_num_cams: 3
use_relative_action: false   # stats 計算時は false (この config は stats 計算専用)
relative_stats_path: null
frame_cache_mode: online     # stats は raw state/action のみ使用、image decode 不要 (mp4 無しでも動作)
frame_cache_root_baked: null
frame_cache_num_variants: 1
auto_precompute_frame_cache: false   # stats 計算は raw data の parquet 経路のみ、precompute 不要
