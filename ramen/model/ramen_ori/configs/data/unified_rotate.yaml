# RAMEN-Ori の data: rotate_table_base の 1 skill だけ (統合 overlay cache、Issue #188 の会場の腕の追加学習)。
# 共通の設定 (sub_datasets より上) と sub は unified_all6.yaml と同じ (test_data_configs.py で一致を確かめる)。
# 違うのは sub が 1 本だけなこと。
#
# 画像は焼き込み済みの jpg だけを読む (baked_overlay、variant 10)。焼き込みの条件は unified_all6.yaml と同じく
# data/bitrobot_lerobot_subtask_datasets/configs/unified_frame_cache.yaml。
#
# Sakura では HF の dataset repo (Team-RAMEN/IROS2026_RAMEN_HARA_rotate_table_base_merged_v1) の meta・data と
# frame_cache_v2_tars の overlay / common を /nvme/unified_cache/rotate_table_base/ に戻す (約 260 GB、
# docs/handoff/issue_155_six_skill_training.md §3)。
_target_: model.ramen_ori.data_lerobot.RamenOriMultiDataset

# ---- 全 sub 共通 (sub では上書きできない) ----
chunk_len: ${model.chunk_len}   # model と data の chunk を 1 か所で決める
img_size: 224
camera_keys:
  - observation.images.cam_0    # head_left (overlay を焼いたカメラ)
  - observation.images.cam_2    # left_wrist
  - observation.images.cam_3    # right_wrist
top_K: 4
num_classes: 7
num_cams: 4
obb_source: none                # overlay は画像に焼き込み済み
# overlay_* は online の overlay でだけ使う (baked では焼き込みの設定 file の値が約束に入る)
overlay_conf_threshold: 0.30
overlay_line_thickness: 2
overlay_class_filter: null
state_variant: 71d
load_prev_image: false          # 画像差分なし (model.temporal: null と組、RO-11)
include_depth_target: false
depth_target_size: [32, 32]
depth_target_num_cams: 3
use_relative_action: false
relative_stats_path: null
frame_cache_mode: baked_overlay
frame_cache_num_variants: 10    # v0 + v1..v9 (焼き込みの bake.num_variants と一致を起動時に確かめる)
auto_precompute_frame_cache: false
# memory の入力 (Issue #141 Phase 7)。1 skill の追加学習は memory を使わないので obb_yolo は落とさなくてよい
memory: false

# ---- sub ごと (書けるのは data の場所だけ)。skill_id は各 sub の episode meta の source_task_index から作る ----
sub_datasets:
  # rotate_table_base (source_task_index=5 → skill_id=4)
  - merged_source_root: /nvme/unified_cache/rotate_table_base/src
    repo_id: local/ramen_ori_rotate_table_base
    frame_cache_root_baked: /nvme/unified_cache/rotate_table_base/v2/overlay
    obb_precomputed_root: /nvme/unified_cache/rotate_table_base/obb_yolo   # memory 用 (統合 cache の OBB、上位 32 個)
    obb_precomputed_hash: ce877e8237be
