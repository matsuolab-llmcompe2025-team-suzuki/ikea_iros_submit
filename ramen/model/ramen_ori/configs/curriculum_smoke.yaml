# H-3 Curriculum 有効化 smoke config (Issue #120 Alt-5)。
# 3 step で stage 1 → stage 2 に切替、sampler の active skills 変化を確認。
#
# 使用例:
#   pixi run train --config-name=curriculum_smoke training.max_steps=6

defaults:
  - real_task5_7_smoke
  - _self_

training:
  balancing:
    enabled: false   # curriculum が優先されるので明示 off
  curriculum:
    enabled: true
    stages:
      - step: 0
        skills: [4]        # stage 1: task 5 (rotate_table_base, skill_id=4) のみ
      - step: 3
        skills: [4, 5]     # stage 2: + task 7 (move_table_base, skill_id=5)
