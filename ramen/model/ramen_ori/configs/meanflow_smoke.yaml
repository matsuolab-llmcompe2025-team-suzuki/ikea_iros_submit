# B-8 MeanFlow action expert swap smoke (Issue #120 Alt-7)。
# FlowMatchingDiT を MeanFlow に差替、e2e 動作確認。

defaults:
  - real_task5_7_smoke
  - _self_

model:
  action_expert:
    _target_: model.ramen_ori.action_expert.MeanFlow
    chunk_len: ${model.chunk_len}
    action_dim: ${model.action_dim}
    embed_dim: 512     # DiT の 768 より小
    depth: 6           # DiT の 12 の半分
    num_heads: 8
    mlp_ratio: 4.0
    context_dim: ${model.d_model}
  sample_n_steps: 1    # MeanFlow は single-step default
