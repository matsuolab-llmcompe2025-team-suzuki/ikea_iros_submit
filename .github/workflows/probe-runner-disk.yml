### 提出 image を GitHub Actions で焼けるかを測るための **使い捨て probe**。
#
# なぜ要るか:
#   提出 image (ikea-thor) は展開後 31.6GB で、いまは特定の Mac 1 台でしか
#   ビルドできない。大会直前にその 1 台が使えないと詰むので CI に載せたい。
#   ただし GitHub-hosted runner の空きディスクは既定で約 14GB しかなく、
#   ベース (nvcr.io/nvidia/pytorch:25.12-py3) を展開するだけで約 25GB 要る。
#
#   → 本ビルドを書く前に「掃除したら何GB空くか」「ベースが展開できるか」だけ測る。
#      これが通らなければ CI 化は諦めて別の手段を採る。
#
# 測り終わったらこの workflow は消す。

name: probe runner disk

on:
  workflow_dispatch:
    inputs:
      runner:
        description: どの runner で測るか
        required: true
        default: ubuntu-24.04-arm
        type: choice
        options:
          - ubuntu-24.04-arm # 提出 image (arm64) 用。本命
          - ubuntu-latest # 検証用 amd64

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - name: 掃除前のディスク
        run: |
          echo "## 掃除前" >> "$GITHUB_STEP_SUMMARY"
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"

      - name: プリインストールを削除して空きを作る
        run: |
          # runner に焼かれている他言語のツールチェーンを落とす。
          # ここで何GB回収できるかが CI 化できるかを決める。
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/lib/node_modules /opt/hostedtoolcache || true
          sudo docker image prune -af || true
          sudo apt-get clean || true
          echo "## 掃除後" >> "$GITHUB_STEP_SUMMARY"
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"

      - name: NGC にログイン
        run: |
          echo '${{ secrets.NGC_API_KEY }}' \
            | docker login nvcr.io -u '$oauthtoken' --password-stdin

      - name: ベース image を pull して実サイズを測る
        run: |
          BASE=nvcr.io/nvidia/pytorch@sha256:1dc787f5c6264fcc1c99809f99b84823e73ed4588d5a581b94290fc2a8fecff8
          time docker pull "$BASE"
          {
            echo "## ベース展開後"
            docker image inspect "$BASE" --format '{{.Architecture}} / {{.Os}} / size={{.Size}}'
            df -h /
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 本ビルドに足りるかの判定
        run: |
          AVAIL_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "残り ${AVAIL_GB}GB" | tee -a "$GITHUB_STEP_SUMMARY"
          # ベース展開済みの状態から、pip 層 (約7GB) + 余裕が要る。
          if [ "$AVAIL_GB" -lt 12 ]; then
            echo "❌ 本ビルドには足りない見込み。CI 化は別手段を検討すること。" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ 本ビルドに進める見込み" | tee -a "$GITHUB_STEP_SUMMARY"
