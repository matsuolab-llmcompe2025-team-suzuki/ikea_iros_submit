# Thor (aarch64 / sm_110) で使う torch を、Thor で実績のある NGC 25.12 の torch と並べて確かめる。
#
# 本体 iros_2026_ramen の推論環境を Thor 用に pixi で作る前の確認 (#10 Step 3b)。
# Thor の実機には繋がらないので、GPU の無い arm64 runner で読める範囲を比べる:
#   import が通るか / CUDA と cuDNN の版 / sm_110 が入っているか / numpy 2 との受け渡し /
#   足りない共有ライブラリ (ldd の not found)。
# 過去に Thor で cu130 wheel の import が libcudss.so.0 不足で落ちた報告がある
# (NVIDIA forum「Pytorch install broken on Jetson Thor」)。ldd で GPU 無しでも分かる。
#
# 確認用。Step 5 の Dockerfile に同じ確認を build 時の assert として入れたら消す。

name: check-thor-torch

on:
  # main に無い workflow は workflow_dispatch で呼べない (build-thor-image.yml と同じ事情)
  # ので、このブランチでこのファイルを push したときに走らせる。
  push:
    branches: [issue/10-rebuild-as-inference-copy]
    paths: [.github/workflows/check-thor-torch.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          # 基準。今の提出 image の base と同じ digest (docker/Dockerfile.thor の ARG BASE)。
          - name: ngc-25.12 (基準)
            image: nvcr.io/nvidia/pytorch@sha256:1dc787f5c6264fcc1c99809f99b84823e73ed4588d5a581b94290fc2a8fecff8
            torch: ""
            torchvision: ""
          # 本体 root pixi の runtime env (entrypoint / YOLO / RAMEN-Ori)。dev の lock と同じ版。
          - name: runtime (torch 2.12.1, py3.10)
            image: python:3.10.20-slim-bookworm@sha256:019e31cc1f52e4139d338bca44f27b71339a9da261738fd80fab9cf4595152fc
            torch: "2.12.1"
            torchvision: "0.27.1"
          # 本体 inference/desktop pixi の default env (GR00T 53D worker)。dev の lock と同じ版。
          - name: 53d-worker (torch 2.11.0, py3.12)
            image: python:3.12.13-slim-bookworm@sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2
            torch: "2.11.0"
            torchvision: "0.26.0"
          # GR00T pick worker。版は仮 (#152 の .venv の uv pip freeze が届いたら差し替える)。
          - name: pick-worker (torch 2.10.0, py3.12)
            image: python:3.12.13-slim-bookworm@sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2
            torch: "2.10.0"
            torchvision: "0.25.0"
    steps:
      - name: nvcr.io にログイン
        if: startsWith(matrix.image, 'nvcr.io/')
        run: |
          echo '${{ secrets.NGC_API_KEY }}' \
            | docker login nvcr.io -u '$oauthtoken' --password-stdin

      - name: probe を書く
        run: |
          mkdir -p probe
          # torch を入れる (NGC は入っているので何もしない)。失敗しても probe まで進めて結果に残す。
          cat > probe/run.sh <<'EOF'
          set -u
          export PIP_ROOT_USER_ACTION=ignore PIP_DISABLE_PIP_VERSION_CHECK=1
          if [ -n "${TORCH:-}" ]; then
            python -m pip install --no-cache-dir -q \
              --index-url https://download.pytorch.org/whl/cu130 "torch==${TORCH}" \
              && echo "PROBE_STEP torch_install=ok" || echo "PROBE_STEP torch_install=FAILED"
            python -m pip install --no-cache-dir -q \
              --index-url https://download.pytorch.org/whl/cu130 "torchvision==${TORCHVISION}" \
              && echo "PROBE_STEP torchvision_install=ok" || echo "PROBE_STEP torchvision_install=FAILED"
            # numpy 2 との受け渡しを見るため (本体の各 env は numpy 2.2.6)。
            python -m pip install --no-cache-dir -q "numpy==2.2.6" \
              && echo "PROBE_STEP numpy_install=ok" || echo "PROBE_STEP numpy_install=FAILED"
          fi
          python /probe/probe.py
          EOF

          cat > probe/probe.py <<'EOF'
          import glob, json, os, platform, subprocess, sys

          r = {"python": sys.version.split()[0], "machine": platform.machine()}
          try:
              import torch
          except Exception as exc:  # noqa: BLE001
              r["import_torch"] = f"FAILED {type(exc).__name__}: {exc}"
              print("PROBE_RESULT " + json.dumps(r, sort_keys=True))
              sys.exit(0)

          r["import_torch"] = "ok"
          r["torch"] = torch.__version__
          r["cuda"] = torch.version.cuda
          # compile 時の TORCH_CUDA_ARCH_LIST。GPU が無くても読める。
          try:
              flags = torch._C._cuda_getArchFlags()
              r["arch_flags"] = flags
              r["has_sm_110"] = "sm_110" in flags
          except Exception as exc:  # noqa: BLE001
              r["arch_flags"] = f"FAILED {exc!r}"
          try:
              r["cudnn"] = torch.backends.cudnn.version()
          except Exception as exc:  # noqa: BLE001
              r["cudnn"] = f"FAILED {exc!r}"
          try:
              import numpy as np
              r["numpy"] = np.__version__
              ok = torch.from_numpy(np.zeros(3)).numpy().shape == (3,)
              r["numpy_bridge"] = "ok" if ok else "wrong shape"
          except Exception as exc:  # noqa: BLE001
              r["numpy_bridge"] = f"FAILED {exc!r}"
          try:
              import torchvision
              r["torchvision"] = torchvision.__version__
          except Exception as exc:  # noqa: BLE001
              r["torchvision"] = f"FAILED {type(exc).__name__}: {exc}"

          # torch の共有ライブラリが引く .so のうち見つからないもの。
          # libcuda.so.1 は driver (Thor では host から入る) なので runner に無いのが正常。
          lib = os.path.join(os.path.dirname(torch.__file__), "lib")
          missing = {}
          for so in sorted(glob.glob(os.path.join(lib, "*.so*"))):
              out = subprocess.run(["ldd", so], capture_output=True, text=True).stdout
              for line in out.splitlines():
                  if "not found" in line:
                      missing.setdefault(line.split()[0], set()).add(os.path.basename(so))
          r["ldd_not_found"] = {k: sorted(v)[:3] for k, v in sorted(missing.items())}
          r["ldd_not_found_except_driver"] = sorted(k for k in missing if k != "libcuda.so.1")
          print("PROBE_RESULT " + json.dumps(r, sort_keys=True))
          EOF

      - name: probe
        env:
          IMAGE: ${{ matrix.image }}
          TORCH: ${{ matrix.torch }}
          TORCHVISION: ${{ matrix.torchvision }}
        run: |
          docker run --rm -e TORCH -e TORCHVISION \
            -v "$PWD/probe:/probe:ro" "$IMAGE" bash /probe/run.sh 2>&1 | tee probe.log
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            grep -E '^PROBE_(STEP|RESULT) ' probe.log || echo "PROBE_RESULT なし (docker run 自体が失敗)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -q '^PROBE_RESULT ' probe.log
