# Team RAMEN — IROS 2026 Humanoid IKEA Assembly Challenge
#
# The manifest the organizer asks for (CONTRACT.md: "Declare one in manifest.yaml";
# RUNBOOK.md: --lane "must match the team's manifest.yaml"). The full venue procedure,
# in the order the pieces must come up, is INSTRUCTIONS.md.
#
# One image, on the Thor. By default nothing of ours runs on PC2: the Thor container subscribes to
# PC2's :5555 / :5557 directly and binds :5556 itself, and the organizer adapter on PC2 is
# started with --actions-host <THOR_IP> (the adapter's own option for where :5556 is bound).
#
# The image is a private GHCR package: the organizer account needs read access.
# Current GB10 checks are recorded in GB10_STATE_GUARD_REPORT.md. Physical tracking is not verified.
# Client/transport loss is NOT certified as a safe stop: see Issue #14 and INSTRUCTIONS.md.
# The adapter mode is decoupled; on it our arms go by default on the joint
# lane ((T,22) joint targets on :5556, interface package 609f61d+), and --boundary-lane pose
# sends (T,25) end-effector poses through the organizer IK instead.

team: RAMEN
lane: joint
platform: linux/arm64

images:
  thor:
    repo_tag: "ghcr.io/matsuolab-llmcompe2025-team-suzuki/ikea-thor:gb10-guard-1cd5fdf"
    digest: "sha256:19ebe27030179aa04bc9d6f8c167971699fcc6417cbc3a5f23b2d2ae7a0f8262"
    # What the operator types per run; everything that never changes at the venue is added
    # by the image entry (docker/venue_entry.sh). Needs -it for N/R/Enter controls.
    # <skill_config_venue.yaml> is venue/skill_config_venue.yaml: the image's own skill_config
    # with only the Dex1 arrival tolerance widened (0.05 -> 0.20 rad), made on the Thor from
    # this image (INSTRUCTIONS.md section 1). Without it, a Dex1 that settles short of the
    # commanded opening ends the run before the policy starts.
    run: >-
      docker run -it --rm --runtime nvidia --gpus all -e NVIDIA_DISABLE_REQUIRE=1 --network host
      -e IROS_ORIN_HOST=<PC2_IP>
      -v <hf_cache>:/root/.cache/huggingface:ro
      -v <outputs>:/app/ramen/outputs
      -v <vlm_cache>:/cache
      -v <skill_config_venue.yaml>:/app/venue_skill_config.yaml:ro
      <image> --stage <0-5> --actuate --skill-config /app/venue_skill_config.yaml
  orin: null   # no PC2-side container (see the header)

sockets:
  "5555": "cameras — subscribed by the Thor container directly from PC2"
  "5557": "state (body_q, base_quat, gripper_q) — subscribed by the Thor container directly from PC2"
  "5556": "actions — BOUND by the Thor container on all interfaces; the adapter dials in with --actions-host <THOR_IP>"
  "8000": "VLM server inside the Thor container, bound to 127.0.0.1 only (Stage 1-4)"
  "5558": "OPTIONAL, not used by default: read-only RAMEN state guard on PC2 (pc2_read_only_guard below)"

# On the event PC2 (G1 (3)) every organizer process runs after `source ~/iros_g1_3/iros_env.sh`
# (cameras: iros_env_teleimager.sh). That env carries this robot's Dex1 calibration
# (IROS_DEX1_*), read only by ~/wbc_adapter/deploy/run_wbc_with_dex1.py and ~/real_orin_state.py;
# the package copies under ~/iros_g1_orin_package hardcode the bench unit's opposite direction.
# THOR_IP = 192.168.123.222, PC2 = 192.168.123.164 (INSTRUCTIONS.md §2).
organizer_stack_on_pc2:
  cameras: "source ~/iros_g1_3/iros_env_teleimager.sh && python ~/real_orin_cameras.py"
  state: "source ~/iros_g1_3/iros_env.sh && python ~/real_orin_state.py"
  wbc: >-
    source ~/iros_g1_3/iros_env.sh && cd ~/GR00T-WholeBodyControl &&
    iros_with_wbc_preload python ~/wbc_adapter/deploy/run_wbc_with_dex1.py --interface eth0
    --no-with-hands --keyboard_dispatcher_type ros --no-enable-onscreen --dex1-max-speed 4.2
  adapter_dry_run: "wbc_driver.py --lane decoupled --actions-host <THOR_IP> --state-source boundary"
  adapter_go_live: "wbc_driver.py --lane decoupled --actions-host <THOR_IP> --live --engage-policy"

runtime:
  network: >-
    no external Internet required at run time: HF_HUB_OFFLINE=1, TRANSFORMERS_OFFLINE=1, YOLO_OFFLINE=true (no ultralytics
    online check or analytics), the VLM runs with usage stats off and every outbound endpoint
    pointed at a closed local port; weights are read from the mounted cache. PC2 camera/state/action
    traffic remains necessary. Current connect() audit results are in GB10_STATE_GUARD_REPORT.md
  # Mounted read-only as a Hugging Face cache (~80 GB). Prefetch and offline check:
  # tools/prefetch_weights.py (list derived from policy_config.yaml: defaults + variant_sets);
  # details in WEIGHTS.md.
  weights:
    - "Team-RAMEN/IROS2026_RAMEN_hara_ramen_ori_venue_rotate_all6@aaa73be26e795376ca9e2fcf2528e0b51b362c67 (ckpt_step_020000.pt)"
    - "robbyant/lingbot-vision-vit-base@main"
    - "Team-RAMEN/IROS2026_RAMEN_hara_ramen_ori_venue_pick_all6@5384b7ed641af16edf10f6b1ecf67713146996af (ckpt_step_020000.pt)"
    - "Team-RAMEN/IROS2026_RAMEN_takada_insert_leg_optimal_diffusion@6c9911b8185ea185e6c929fbe9ede7d586c1bf09"
    - "Team-RAMEN/IROS2026_RAMEN_takada_rotate_leg_to_tighten_optimal_gr00t_200k@51e306fd19dfbcba81932c6b6f073615fdb54b26"
    - "Team-RAMEN/IROS2026_RAMEN_suzuki_flip_table_groot_n17_2_baseline_checkpoints@1a408d87eda8d01f9b79113f1aed97a5d0811bff (checkpoints/020000/pretrained_model)"
    - "nvidia/GR00T-N1.7-3B@2fc962b973bccdd5d8ce4f67cc63b264d6886495"
    - "nvidia/Cosmos-Reason2-2B@main (gated)"
    - "Team-RAMEN/IROS2026_RAMEN_Hara_yoloobb_upperpolicy@8221d0aef45d63666537c1f030810fb9b56dd1ed (runs/m_lowaug_v11b/weights/best_20260818.pt)"
    - "Qwen/Qwen3-VL-8B-Instruct@main"
    # R-time candidates (alternatives_by_skill, chosen after R with --gpu-models plan); not defaults.
    - "Team-RAMEN/groot-n1.7-pick-legs-ver1@b63d9c49482cfc8998d1a3a0e3e0ac3ceb1d620a (checkpoint-40000 runtime files)"
    - "Team-RAMEN/IROS2026_RAMEN_hara_ramen_ori_141_c32_state_dropout@b19c7770e46cf6e1545f443a25624f5ec57cdb4b (ckpt_step_100000.pt)"
    - "Team-RAMEN/IROS2026_RAMEN_hara_ramen_ori_venue_insert_all6@427d42dd29c0f8a8ff81a3c2319ab7710cdb1f8c (ckpt_step_020000.pt)"
    - "Team-RAMEN/IROS2026_RAMEN_hara_ramen_ori_venue_flip_all6@2cbf2ce750d9cf711b63ac5d82ccca5cf17acfe7 (ckpt_step_020000.pt)"
    # Candidate only (variant set all6_400k, selected with --policy-variant-set); not a default.
    - "Team-RAMEN/IROS2026_RAMEN_hara_ramen_ori_all6_state_dropout@17b5658e33f98e264a6e05481fc9d069e9fde546 (ckpt_step_400000.pt)"
  # Planning estimate, NOT a Thor measurement/upper bound. Source 10b8d73 on GB10,
  # continuous Stages 0-5 with all experts resident: 44.36 GiB GPU-process peak and
  # 39.78 GiB minimum MemAvailable. Rounded reserve below is not a guarantee.
  peak_memory_thor_gb: 55

conformance: >-
  docker run --rm --network host <image>
  pixi run --as-is -e runtime python /app/conformance.py --lane decoupled

# OPTIONAL and off by default (INSTRUCTIONS.md section 7). A read-only process on PC2 that
# confirms each :5557 payload with a fresh rt/lowstate tick and serves it on :5558; the Thor
# uses it only when the run adds --boundary-state-guard --boundary-state-port 5558. Requires an
# image built with it (gb10-guard-1cd5fdf) and the organizer's approval on PC2.
# Without it the Thor reads :5557 directly, as declared above.
pc2_read_only_guard:
  enabled_by_default: false
  bundle: "python3 tools/package_pc2_guard.py /tmp/ramen-pc2-guard.tar.gz"
  preflight: "python venue_state_guard.py --check-only"
  run: "python venue_state_guard.py --bind-address <PC2_IP>"
  thor_option: "--boundary-state-guard --boundary-state-port 5558"
  commands_to_robot: false
