# Team RAMEN — IROS 2026 Humanoid IKEA Assembly Challenge
#
# The manifest the organizer asks for (CONTRACT.md: "Declare one in manifest.yaml";
# RUNBOOK.md: --lane "must match the team's manifest.yaml"). The full venue procedure,
# in the order the pieces must come up, is INSTRUCTIONS.md.
#
# One image, on the Thor. Nothing of ours runs on PC2: the Thor container subscribes to
# PC2's :5555 / :5557 directly and binds :5556 itself, and the organizer adapter on PC2 is
# started with --actions-host <THOR_IP> (the adapter's own option for where :5556 is bound).
#
# The image is a private GHCR package: the organizer account needs read access.
# Fields marked TBD are filled when the image is released (digest) and measured (memory).

team: RAMEN
lane: decoupled
platform: linux/arm64

images:
  thor:
    repo_tag: "ghcr.io/matsuolab-llmcompe2025-team-suzuki/ikea-thor:TBD"
    digest: "sha256:TBD"
    # What the operator types per run; everything that never changes at the venue is added
    # by the image entry (docker/venue_entry.sh). Needs -it for the two Enter prompts.
    run: >-
      docker run -it --rm --runtime nvidia --gpus all -e NVIDIA_DISABLE_REQUIRE=1 --network host
      -e IROS_ORIN_HOST=<PC2_IP>
      -v <hf_cache>:/root/.cache/huggingface:ro
      -v <outputs>:/app/ramen/outputs
      -v <vlm_cache>:/cache
      <image> --stage <0-5> --actuate
  orin: null   # no PC2-side container (see the header)

sockets:
  "5555": "cameras — subscribed by the Thor container directly from PC2"
  "5557": "state (body_q, base_quat, gripper_q) — subscribed by the Thor container directly from PC2"
  "5556": "actions — BOUND by the Thor container on all interfaces; the adapter dials in with --actions-host <THOR_IP>"
  "8000": "VLM server inside the Thor container, bound to 127.0.0.1 only (Stage 1-4)"

organizer_stack_on_pc2:
  wbc: >-
    run_wbc_with_dex1.py --interface real --no-with-hands --keyboard_dispatcher_type ros
    --no-enable-onscreen --dex1-max-speed 4.2
  adapter_dry_run: "wbc_driver.py --lane decoupled --actions-host <THOR_IP> --state-source boundary"
  adapter_go_live: "wbc_driver.py --lane decoupled --actions-host <THOR_IP> --live --engage-policy"

runtime:
  network: >-
    none at run time: HF_HUB_OFFLINE=1, TRANSFORMERS_OFFLINE=1, YOLO_OFFLINE=true (no ultralytics
    online check or analytics), the VLM runs with usage stats off and every outbound endpoint
    pointed at a closed local port; weights are read from the mounted cache. Verified with strace
    on an arm64 GB10: no connect() other than loopback and Unix sockets
  # Mounted read-only as a Hugging Face cache (~86 GB). Prefetch and offline check:
  # tools/prefetch_weights.py (list derived from policy_config.yaml); details in WEIGHTS.md.
  weights:
    - "Team-RAMEN/IROS2026_RAMEN_hara_ramen_ori_141_c32_state_dropout@b19c7770e46cf6e1545f443a25624f5ec57cdb4b (ckpt_step_100000.pt)"
    - "robbyant/lingbot-vision-vit-base@main"
    - "Team-RAMEN/groot-n1.7-pick-legs-ver1@b63d9c49482cfc8998d1a3a0e3e0ac3ceb1d620a (checkpoint-40000 runtime files)"
    - "Team-RAMEN/IROS2026_RAMEN_takada_insert_leg_optimal_gr00t_200k@0f0927bcc1aed6927fb26b82c017009961ee3d35"
    - "Team-RAMEN/IROS2026_RAMEN_takada_rotate_leg_to_tighten_optimal_gr00t_200k@51e306fd19dfbcba81932c6b6f073615fdb54b26"
    - "Team-RAMEN/IROS2026_RAMEN_suzuki_flip_table_groot_n17_2_baseline_checkpoints@1a408d87eda8d01f9b79113f1aed97a5d0811bff (checkpoints/020000/pretrained_model)"
    - "nvidia/GR00T-N1.7-3B@2fc962b973bccdd5d8ce4f67cc63b264d6886495"
    - "nvidia/Cosmos-Reason2-2B@main (gated)"
    - "Team-RAMEN/IROS2026_RAMEN_Hara_yoloobb_upperpolicy@8221d0aef45d63666537c1f030810fb9b56dd1ed (runs/m_lowaug_v11b/weights/best_20260818.pt)"
    - "Qwen/Qwen3-VL-8B-Instruct@main"
  peak_memory_thor_gb: TBD

conformance: >-
  docker run --rm --network host <image>
  pixi run --as-is -e runtime python /app/conformance.py --lane decoupled
