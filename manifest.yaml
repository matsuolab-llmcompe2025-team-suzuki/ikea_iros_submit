# IKEA IROS submission manifest (Issue #116)
#
# 運営 2026-08 の container build 訂正を反映。base image は確定。
# 提出時は下記 + INSTRUCTIONS.md の docker run + conformance ログ + contact を添える。

# モデルで決まる lane。RAMEN-Ori は非 GR00T-SONIC = decoupled ((T,25) task-space)。
lane: decoupled

# 両 image とも linux/arm64 (aarch64) でビルドすること。
platform: linux/arm64

images:
  thor:                       # policy server / sm_110 Blackwell / JetPack 7.2 / CUDA 13
    repo_tag: "ghcr.io/matsuolab-llmcompe2025-team-suzuki/ikea-thor:onboarding"
    digest: "sha256:a32494cd2c8fd23b49cc1f4209f7c49e1d4645acd90092ce8b8028a352e3170a"
    base_image: "nvcr.io/nvidia/cuda:13.0.0-devel-ubuntu24.04"   # 標準 NGC CUDA (l4t ではない)
    entrypoint:
      ["python3", "-u", "components/server.py",
       "--lane", "decoupled", "--host", "0.0.0.0", "--port", "8765"]
  orin:                       # policy client / sm_87 Ampere / JetPack 5.1.1 / CUDA 11.4
    repo_tag: "ghcr.io/matsuolab-llmcompe2025-team-suzuki/ikea-orin:onboarding"
    digest: "sha256:a7a6448893e7dbd80f554cd1bd7a0f648ea1ef25f849012e8565f737c10b04d4"
    base_image: "nvcr.io/nvidia/l4t-jetpack:r35.3.1"  # device の L4T R35.3.1 に完全一致必須
    entrypoint:
      ["python3", "-u", "components/client.py",
       "--lane", "decoupled", "--thor", "192.168.100.1", "--orin", "192.168.100.2"]

thor_orin_port: 8765          # components/transport.py の WebSocket port

# weights は image に焼き込まない。RAMEN-Ori (#115) の HF repo を指す。
weights_uri: "hf://Team-RAMEN/TBD"                    # RAMEN-Ori weights 確定後

# Thor 上の想定ピーク GPU mem (128 GB unified)。RAMEN-Ori load 後に実測して確定。
peak_gpu_memory_thor_gb: "TBD"
