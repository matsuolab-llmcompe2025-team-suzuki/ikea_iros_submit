# IKEA IROS submission manifest — GR00T-pick track (Issue #128 deploy)
#
# RAMEN-Ori 用 manifest.yaml とは別 track。GR00T pick 単体を decoupled lane で動かす。
# 提出時にどちらを canonical manifest.yaml にするかは team 判断 (現状は feature branch で並存)。
#
# ⚠️ thor image は private (新規 GHCR package)。運営アカウントに read 権限付与が必要
#    (既存 ikea-thor/ikea-orin と同じ手続き = onboarding Finding 2)。
# ⚠️ 実 Thor での実行 (server ready + conformance + (T,25)) は未検証。arm64 build のみ検証済。

lane: decoupled
platform: linux/arm64

images:
  thor:                       # policy server / GR00T 全5 skill + full orchestrator (YOLO)
    # 既存 ikea-thor package の新 tag (運営に伝達済の名前を維持、旧 tag は温存)。
    #
    # ✅ **2 系統 (#128 eeorigin / #1 vendorsync) の合流 + orchestrator 修正入り。**
    repo_tag: "ghcr.io/matsuolab-llmcompe2025-team-suzuki/ikea-thor:20260920-orch-lerobot61"
    digest: "sha256:cdaf7a3d1da8584f7adf20470b32f686e03294ad70d07132b18ceb8d3e46a1c8"
    #   linux/arm64 manifest = sha256:c3fb6e5f921b40325044b05798f5f26784cff1774124ac7b0799f273ccb9ca79
    #
    # --- eeorigin (main、#128) に入っているもの -------------------------------
    #   numpy2.x ABI fix (base25.12) + YOLO recursive glob + serve前 warmup +
    #   GrootConfig / FurnitureGrootRuntimeConfig type strip (base registry) +
    #   GPU overhead env 化 + 53D FK を CWD 非依存 path (assets/) に修正 +
    #   **publish EE を wrist_yaw_link 原点 (zero tool offset) に修正**
    #   (運営 IK は zero offset 固定 = WBC_RUNBOOK §3。pick の IK 残差 60x の原因だった)
    #
    # --- boundary-stagefix (この branch、#1) に入っているもの -------------------
    #   1. components/ramen/vendor/desktop/ を iros_2026_ramen へ全面同期 (77 files、
    #      約 3 週間のドリフト解消)。YOLO warmup 欠落の修正 = 初回推論 1.8s が
    #      CAMERA_STALE_TIMEOUT_S=0.5 を超えて毎回 safety-stop していたバグを含む
    #   2. 自前経路 (inference/desktop/entrypoint.py) を image に同梱
    #   3. CycloneDDS 0.10.2 + unitree_sdk2py@65691c8 を同梱 (rt/arm_sdk / LocoClient 用)
    #   4. base を index digest で pin (可変 tag の入れ替わり防止)
    #   5. --action-sink boundary で stage 1-4 が起動できなかったバグの修正
    #      (グリッパを使う stage が丸ごと取れない状態だった)
    #   6. RAMEN_POLICY=groot_orchestrator が DeferredPolicy の signature 変更で
    #      起動不能だったのを修正 (manifest が「推奨」と書いている経路)
    #   7. **同じ経路が 53D expert を 1 つも読めなかったのを修正。**
    #      orchestrator は 53D を server 自身の process に読むが、それは
    #      lerobot 0.6.1 でないと config.json を draccus が弾く。image の CMD は
    #      0.6.0 で、0.6.1 の /opt/venv-groot53 は worker にしか渡っていなかった。
    #      → RAMEN_POLICY=groot_orchestrator のとき 0.6.1 へ os.execv で入り直す。
    #      併せて warmup の例外握りつぶしをやめた (この不具合は起動ログ上
    #      正常に見えていた)。RunPod の A100 80GB で実測:
    #        修正前 DecodingError / GPU 425MiB → 修正後 policy ready / GPU 7273MiB
    #
    # 🔴 **旧 tag を誤って pull しないこと。どちらも片方を欠いている:**
    #      20260920-groot-orch-eeorigin … 上記 1-6 が無い。とくに
    #        RAMEN_POLICY=groot_orchestrator が DeferredPolicy の TypeError で
    #        **起動しない** (manifest が「推奨」と書いている経路)。
    #        --action-sink boundary の stage 1-4 も起動しない
    #      20260920-boundary-stagefix   … EE 原点修正が無い (pick の IK 残差 60x が残る)
    #      20260920-eeorigin-vendorsync … 上記 7 が無い
    #        (groot_orchestrator が 53D を読めず、しかも起動したように見える)
    #
    # image 内検証 (2026-09-20、arm64 コンテナ内で実行):
    #   - 大会経路 components/ramen/g1_urdf_fk.compute_ee_transforms が
    #     wrist_yaw_link 原点を返す (zero tool offset)
    #   - 自前経路 vendor/.../perception/g1_urdf_fk も同様。かつ
    #     compute_ee_state は tool offset を維持 (差 = [0.087, -0.034, 0.092] m)
    #   - --action-sink boundary --stage 1 が起動、--synthetic-hand-state の
    #     ガードも生存
    #   - cyclonedds 0.10.2 + unitree_sdk2py(LOCO_SERVICE_NAME="sport") + CRC()
    #   - orchestrator_driver が assembly.load_policy 経由
    #   - conformance.py --lane decoupled が stub / groot_pick とも PASS (40/0)
    base_image: "nvcr.io/nvidia/pytorch@sha256:1dc787f5c6264fcc1c99809f99b84823e73ed4588d5a581b94290fc2a8fecff8"
    base_image_tag: "nvcr.io/nvidia/pytorch:25.12-py3"   # numpy 2.x ABI torch
    # image ENV 既定は pick 単体 (RAMEN_POLICY=groot_pick_real)。run 時 env で切替:
    #   - full orchestrator (推奨、perception[YOLO]+dwell で skill 自動遷移=「一通り全部」):
    #       -e RAMEN_POLICY=groot_orchestrator -e HF_TOKEN=<token>
    #   - 53D 単体: -e RAMEN_POLICY=groot_53d_real -e RAMEN_VARIANT=<skill>
    #       (groot_rotate_leg_200k / groot_insert_leg_200k / groot_overlay /
    #        groot_flip_table_n17_2_baseline)
    # 2 lerobot env 内蔵 (pick=0.6.0 image main / 53D=0.6.1 /opt/venv-groot53)、YOLO=ultralytics。
    entrypoint:
      ["python3", "-u", "components/server.py",
       "--lane", "decoupled", "--host", "0.0.0.0", "--port", "8765"]
  orin:                       # policy client (model 非依存の relay、RAMEN-Ori track と共通)
    repo_tag: "ghcr.io/matsuolab-llmcompe2025-team-suzuki/ikea-orin:onboarding"
    digest: "sha256:a7a6448893e7dbd80f554cd1bd7a0f648ea1ef25f849012e8565f737c10b04d4"
    base_image: "nvcr.io/nvidia/l4t-jetpack:r35.3.1"
    entrypoint:
      ["python3", "-u", "components/client.py",
       "--lane", "decoupled", "--thor", "192.168.100.1", "--orin", "192.168.100.2"]

thor_orin_port: 8765

# GR00T pick weights (ver2-lora, private Team-RAMEN)。image に焼かず runtime に HF 取得。
#   docker run 時に -e HF_TOKEN=<token> を渡すこと (private repo pull に必須)。
weights_uri: "hf://Team-RAMEN/groot-n1.7-pick-legs-ver2-lora@8f875028fffb1b35ebaf6a95d1575ccec86c12a1"

# Thor 上の想定ピーク GPU mem。実 Thor で GR00T load 後に実測して確定。
peak_gpu_memory_thor_gb: "TBD"   # 実機測定待ち (128 GB unified)
