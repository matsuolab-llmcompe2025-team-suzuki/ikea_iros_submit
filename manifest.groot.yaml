# IKEA IROS submission manifest — GR00T-pick track (Issue #128 deploy)
#
# RAMEN-Ori 用 manifest.yaml とは別 track。GR00T pick 単体を decoupled lane で動かす。
# 提出時にどちらを canonical manifest.yaml にするかは team 判断 (現状は feature branch で並存)。
#
# ⚠️ thor image は private (新規 GHCR package)。運営アカウントに read 権限付与が必要
#    (既存 ikea-thor/ikea-orin と同じ手続き = onboarding Finding 2)。
# ⚠️ 実 Thor (sm_110) での実行は未検証。arm64 build と、**同一 Dockerfile の amd64 image を
#    A100 80GB の pod に載せた実行検証**まで済んでいる (下の「実 image 検証」を参照)。

lane: decoupled
platform: linux/arm64

images:
  thor:                       # policy server / GR00T 全5 skill + full orchestrator (YOLO)
    # 既存 ikea-thor package の新 tag (運営に伝達済の名前を維持、旧 tag は温存)。
    #
    # ✅ **2 系統 (#128 eeorigin / #1 vendorsync) の合流 + orchestrator 修正 + pick 修正入り。**
    repo_tag: "ghcr.io/matsuolab-llmcompe2025-team-suzuki/ikea-thor:20260921-parity"
    digest: "sha256:ee665394e579174ee379408a081e29ab11ac0b4ec3b2234cee2bb8b481ed1047"
    #   単一 platform (linux/arm64) の OCI manifest。index ではないので digest はこれ 1 本。
    #   config の architecture=arm64 / os=linux を GHCR 上で確認済み。
    #
    # --- eeorigin (main、#128) に入っているもの -------------------------------
    #   numpy2.x ABI fix (base25.12) + YOLO recursive glob + serve前 warmup +
    #   GrootConfig / FurnitureGrootRuntimeConfig type strip (base registry) +
    #   GPU overhead env 化 + 53D FK を CWD 非依存 path (assets/) に修正 +
    #   **publish EE を wrist_yaw_link 原点 (zero tool offset) に修正**
    #   (運営 IK は zero offset 固定 = WBC_RUNBOOK §3。pick の IK 残差 60x の原因だった)
    #
    # --- boundary-stagefix (この branch、#1) に入っているもの -------------------
    #   1. components/ramen/vendor/desktop/ を iros_2026_ramen へ全面同期 (77 files、
    #      約 3 週間のドリフト解消)。YOLO warmup 欠落の修正 = 初回推論 1.8s が
    #      CAMERA_STALE_TIMEOUT_S=0.5 を超えて毎回 safety-stop していたバグを含む
    #   2. 自前経路 (inference/desktop/entrypoint.py) を image に同梱
    #   3. CycloneDDS 0.10.2 + unitree_sdk2py@65691c8 を同梱 (rt/arm_sdk / LocoClient 用)
    #   4. base を index digest で pin (可変 tag の入れ替わり防止)
    #   5. --action-sink boundary で stage 1-4 が起動できなかったバグの修正
    #      (グリッパを使う stage が丸ごと取れない状態だった)
    #   6. RAMEN_POLICY=groot_orchestrator が DeferredPolicy の signature 変更で
    #      起動不能だったのを修正 (manifest が「推奨」と書いている経路)
    #   7. **同じ経路が 53D expert を 1 つも読めなかったのを修正。**
    #      orchestrator は 53D を server 自身の process に読むが、それは
    #      lerobot 0.6.1 でないと config.json を draccus が弾く。image の CMD は
    #      0.6.0 で、0.6.1 の /opt/venv-groot53 は worker にしか渡っていなかった。
    #      → RAMEN_POLICY=groot_orchestrator のとき 0.6.1 へ os.execv で入り直す。
    #      併せて warmup の例外握りつぶしをやめた (この不具合は起動ログ上
    #      正常に見えていた)。RunPod の A100 80GB で実測:
    #        修正前 DecodingError / GPU 425MiB → 修正後 policy ready / GPU 7273MiB
    #
    #   8. **pick_table_leg (Stage 1 の先頭) が container で必ず落ちていたのを修正。**
    #      vendor tree は components/ramen/vendor/{desktop,model} で desktop/ が 1 段
    #      挟まるため、上流 groot_pick_legs.py の repo_root = parents[4] が
    #      vendor/desktop を指し worker script を見失う。さらに worker interpreter が
    #      dev 専用の model/subtask_policy_training/.venv/bin/python 決め打ちで、
    #      .dockerignore が .venv/ を除外しているため image には存在し得ない。
    #      どちらも fallback 無しの FileNotFoundError。DeferredPolicy は skill 開始時に
    #      初めて load するので、rotate_table_base が通った後に落ちる = 起動ログ上は
    #      正常に見える。→ worker script の実在で repo root を選び、interpreter は
    #      RAMEN_WORKER_PYTHON を見る (tools/vendor_patches.py の 2 本目)
    #   9. **os.execv が -u を落として `listening` 行が出なかったのを修正。**
    #      stdout が block buffer になり
    #        [serve] policy server listening on ws://0.0.0.0:8765
    #      が出ない。会場手順は「この行が出るまで client を繋ぐな」なので、
    #      先に繋ぐと accept が near-zero になり、しかも症状が「Thor を PC2 より
    #      先に起動した」場合と同じで切り分けできない。re-exec するのは
    #      RAMEN_POLICY=groot_orchestrator = 大会当日の構成だけなので会場でだけ踏む
    #
    # build 時に worker の起動可能性を assert するようにした (image が緑なのに会場で
    # worker だけ落ちる形を build で止める):
    #   [build] pick worker OK (lerobot 0.6.0 + accelerate + safetensors)
    #   [build] 53D worker OK (lerobot 0.6.1 env から -m で起動できる)
    #   [build] orchestrator pick worker OK
    #
    #  10. 🔴 **orchestrator が rotate_table_base から永久に出られなかったのを修正。**
    #      `enter_pick_table_leg` は `state.base_rotation_start_table_top_verts` が
    #      None なら必ず False を返す。この基準は `state.transition()` の ctx 経由
    #      でしか入らないが、`rotate_table_base` が **initial_skill** のときの
    #      auto start は `dispatcher.start()` を直接呼ぶので transition を通らない。
    #      boundary の OrchestratorDriver は initial_skill="rotate_table_base" なので
    #      **大会経路そのものが該当**し、Stage 1 の 1 skill 目から先へ進めなかった。
    #      → ring が満ちた最初の tick で基準を 1 度だけ seed する
    #  11. 🔴 **RAMEN_POLICY=groot_53d_real が 53D を読めなかったのを修正。**
    #      #7 と同じ原因 (親が lerobot 0.6.0) だが re-exec の条件が
    #      groot_orchestrator だけで 53D 単体経路が漏れていた。
    #      **flip_table (Stage 5 の唯一の skill) はこの経路でしか動かせない**。
    #      pick(38D) は worker を別 process に出すので踏まない = pick だけ試しても
    #      気付けなかった
    #
    #  12. **`--stage 5 --action-sink boundary` が成立しなかったのを修正。**
    #      boundary は --use-real-hand を禁止する一方、stage 5 の検証はそれを要求して
    #      いて boundary 例外が無かった (#5 で stage 1-4 を直したときの漏れ)。
    #      --phase3-full は別の検証関数を通るので動いており、**単独 stage だけ**が
    #      落ちていた = 会場で flip だけやり直す手段が塞がっていた
    #  13. 🔴 **自前経路 (entrypoint.py) が container で一切起動できなかったのを修正。**
    #      cyclonedds 0.10.2 は `<Tracing><Verbosity>config</Verbosity></Tracing>` を
    #      含む config で Domain を作ると glibc の _FORTIFY_SOURCE に引っかかって
    #      `*** buffer overflow detected ***` で **core dump** する。unitree の
    #      ChannelConfigHasInterface は必ずこの block を持つので
    #      `ChannelFactoryInitialize(0, <interface>)` が全滅し、--interface を必ず
    #      渡す entrypoint は Stage 0 の歩行 (+2点) を含めて起動できなかった。
    #      interface 指定なしの ChannelConfigAutoDetermine は Tracing を持たず
    #      落ちないので、import / DomainParticipant(0) / CRC() だけを見ていた
    #      従来の build assert は通り抜けていた。
    #      → Tracing block を剥がし、build assert に
    #        `ChannelFactoryInitialize(0, "lo")` を追加した
    #
    #  14. **大会経路に skill 前進の受け皿が無かったのを修正。**
    #      `tick()` は YOLO の enter_check しか見ず、is_complete /
    #      max_seconds_hard / max_dwell_sec は `run_live()` (自前経路) の局所変数に
    #      閉じていた。boundary の driver は `tick()` を直接回すので、YOLO が
    #      落とすと skill が進まないまま stage が終わる。会場は学習データと違う
    #      シーンなので現実的なリスク。
    #      → `advance_finished_skill()` に切り出して両経路から呼ぶ。driver は
    #        skill_config.yaml の値を自前経路と同じ規約で読む
    #        (rotate_table_base 30s / pick 21s / insert 21s / rotate_leg 58s、
    #         いずれも on_timeout: advance)
    #      ⚠️ 時間切れ前進は「うまくいった証拠ではない」。掴めていない脚を持った
    #        まま insert へ進む可能性は残る。YOLO が主で、これは止まり続けるより
    #        マシという位置づけ
    #
    #  15. 🔴 **大会経路が自前経路と違う組み立てになっていたのを揃えた (10 箇所)。**
    #      driver が `assembly.build_vla_skill` を通さず `VlaCls(...)` を直接
    #      呼んでいたため、assembly が入れる 6 項目が丸ごと抜けていた:
    #        language_override  rotate_table_base は variant が specialist 用の
    #                           'rotate table base' なのに class の
    #                           "rotate and move table base (combined 5+7)" で推論
    #        dispatch_waist     rotate_table_base は config が False なのに腰を出す
    #        motion_limiter     速度・加速度の包絡 + 位置の限界が無い
    #        teacher_range      4 skill 全てに設定があるのに効かない
    #        wrist FK (skill別) rotate_table_base の独自 offset が効かず 4.4cm ずれる
    #        progress_monitor   rotate_table_base で on になる設定が効かない
    #      加えて 4 つ:
    #        policy_filter      policy が見る検出が planner 用の遅れた出力だった
    #        on_tick            ModelResidency 未接続 = skill 切替で act() が
    #                           25〜92 秒ブロック (実測 pick 24.7 / insert 92 /
    #                           rotate_leg 69 秒)
    #        log_sink           JSONL が出ず、手順書の「taskspace_25 を見る」が不能
    #        4 脚ループ          rotate_leg_to_tighten が終端で 1 脚しか回らなかった
    #  16. **`groot_53d_real` の prompt と腰も揃えた。**
    #      VlaSkill を通さない薄い経路なので、prompt が運営の obs 任せ、腰は
    #      常時出す、になっていた。flip は Stage 5 の唯一の skill で
    #      **大会経路ではこの backend でしか動かせない**
    #
    # 🔴 **旧 tag を誤って pull しないこと。どれも何かを欠いている:**
    #      20260921-advance-backup      … 上記 15-16 が無い。**別 prompt で推論し、
    #        skill 切替のたびに 25〜92 秒止まり、脚が 1 本しか回らない**
    #      20260921-stage-dds-fix       … 上記 14-16 が無い。**YOLO が落ちると止まったまま**
    #      20260921-orch-seedfix        … 上記 12-14 が無い。**自前経路が起動しない**
    #      20260920-pickfix-unbuffered  … 上記 10-13 が無い。**orchestrator が
    #        rotate_table_base から進めず、flip も起動しない**
    #      20260920-orch-lerobot61      … 上記 8-11 が無い。**pick_table_leg が必ず落ちる**
    #      20260920-groot-orch-eeorigin … 上記 1-6 が無い。とくに
    #        RAMEN_POLICY=groot_orchestrator が DeferredPolicy の TypeError で
    #        **起動しない** (manifest が「推奨」と書いている経路)。
    #        --action-sink boundary の stage 1-4 も起動しない
    #      20260920-boundary-stagefix   … EE 原点修正が無い (pick の IK 残差 60x が残る)
    #      20260920-eeorigin-vendorsync … 上記 7 が無い
    #        (groot_orchestrator が 53D を読めず、しかも起動したように見える)
    #
    # 実 image 検証 (2026-09-20、同一 Dockerfile の amd64 image を RunPod A100 80GB の
    # pod の image にして実行。venv 再現ではなく image そのもの):
    #   - orchestrator の 4 expert が全て load + forward
    #       pick_table_leg        groot_pick_legs_v2     load 24.7s / 3 tick / (16,19) finite
    #       insert_table_leg      groot_insert_leg_200k  92s / 3 tick finite
    #       rotate_leg_to_tighten groot_rotate_leg_200k  69s / 3 tick finite
    #       rotate_table_base     groot_overlay          load 64.6s + first forward
    #         ※ tick は「overlay はダミー画像を拒否」で止まる = 仕様
    #   - OrchestratorDriver が valid (T,25) を出す (skill=rotate_table_base)
    #   - RAMEN_POLICY=groot_orchestrator が listening まで到達 (約 2 分)
    #   - 53D 推論時 GPU 5.9GiB (tensor-streamed load)
    #
    # 実シーン 1 枚 (outputs/yolo_smoke_20260920/frame_raw.jpg) を回しながら
    # OrchestratorDriver を 40 tick 駆動 (2026-09-21):
    #   - seeded base rotation reference → tick 10 (25°) で
    #     `fire transition: rotate_table_base -> pick_table_leg`
    #   - 遷移先の expert が DeferredPolicy として skill 開始時に load される所まで確認
    #   - 38/40 tick で valid (T,25)
    #   ※ insert 以降は手の接触 signal が要る (enter_insert_table_leg) ので、
    #     手が写っていない静止シーンでは発火しない。配線の確認であって
    #     推論品質の検証ではない。
    #
    # 運営 harness 相当 (mock_orin + server + client + mock_wbc、2026-09-21):
    #   - groot_pick_real                      40 accepted / 0 rejected
    #   - groot_53d_real + flip                40 accepted / 0 rejected (T=14〜16、age 0.012s)
    #   - groot_orchestrator                   mock カメラに卓が無く overlay が拒否
    #     → **conformance.py で推奨経路は検証できない**。実カメラが要る
    # 自前経路の起動確認 (--interface lo、実機なしなので state 待ちで止まる、2026-09-21):
    #   - --stage 0 / 1 / 5 いずれも --action-sink boundary --synthetic-hand-state で
    #     起動して待機に入る (DDS 初期化を通過)
    #   - --policy-variant-* の欠落は起動時に正しく reject される
    #
    # ⚠️ conformance.py は server 起動後 **2.0 秒**しか待たない (conformance.py:93)。
    #    実 policy は listening まで 45〜60 秒かかるので、素で走らせると必ず
    #    "0 accepted / FAIL" になる。上の結果は server を先に温めてから同じ 4 process を
    #    組んだもの。運営 harness は無改変のまま。
    #
    # image 内検証 (2026-09-20、arm64 コンテナ内で実行):
    #   - 大会経路 components/ramen/g1_urdf_fk.compute_ee_transforms が
    #     wrist_yaw_link 原点を返す (zero tool offset)
    #   - 自前経路 vendor/.../perception/g1_urdf_fk も同様。かつ
    #     compute_ee_state は tool offset を維持 (差 = [0.087, -0.034, 0.092] m)
    #   - --action-sink boundary --stage 1 が起動、--synthetic-hand-state の
    #     ガードも生存
    #   - cyclonedds 0.10.2 + unitree_sdk2py(LOCO_SERVICE_NAME="sport") + CRC()
    #   - orchestrator_driver が assembly.load_policy 経由
    #   - conformance.py --lane decoupled が stub / groot_pick とも PASS (40/0)
    base_image: "nvcr.io/nvidia/pytorch@sha256:1dc787f5c6264fcc1c99809f99b84823e73ed4588d5a581b94290fc2a8fecff8"
    base_image_tag: "nvcr.io/nvidia/pytorch:25.12-py3"   # numpy 2.x ABI torch
    # image ENV 既定は pick 単体 (RAMEN_POLICY=groot_pick_real)。run 時 env で切替:
    #   - full orchestrator (推奨、perception[YOLO]+dwell で skill 自動遷移=「一通り全部」):
    #       -e RAMEN_POLICY=groot_orchestrator -e HF_TOKEN=<token>
    #   - 53D 単体: -e RAMEN_POLICY=groot_53d_real -e RAMEN_VARIANT=<skill>
    #       (groot_rotate_leg_200k / groot_insert_leg_200k / groot_overlay /
    #        groot_flip_table_n17_2_baseline)
    # 2 lerobot env 内蔵 (pick=0.6.0 image main / 53D=0.6.1 /opt/venv-groot53)、YOLO=ultralytics。
    entrypoint:
      ["python3", "-u", "components/server.py",
       "--lane", "decoupled", "--host", "0.0.0.0", "--port", "8765"]
  orin:                       # policy client (model 非依存の relay、RAMEN-Ori track と共通)
    repo_tag: "ghcr.io/matsuolab-llmcompe2025-team-suzuki/ikea-orin:onboarding"
    digest: "sha256:a7a6448893e7dbd80f554cd1bd7a0f648ea1ef25f849012e8565f737c10b04d4"
    base_image: "nvcr.io/nvidia/l4t-jetpack:r35.3.1"
    entrypoint:
      ["python3", "-u", "components/client.py",
       "--lane", "decoupled", "--thor", "192.168.100.1", "--orin", "192.168.100.2"]

thor_orin_port: 8765

# GR00T pick weights (ver2-lora, private Team-RAMEN)。image に焼かず runtime に HF 取得。
#   docker run 時に -e HF_TOKEN=<token> を渡すこと (private repo pull に必須)。
weights_uri: "hf://Team-RAMEN/groot-n1.7-pick-legs-ver2-lora@8f875028fffb1b35ebaf6a95d1575ccec86c12a1"

# Thor 上の想定ピーク GPU mem。実 Thor で GR00T load 後に実測して確定。
peak_gpu_memory_thor_gb: "TBD"   # 実機測定待ち (128 GB unified)
